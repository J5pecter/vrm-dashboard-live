<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRM Revenue Dashboard</title>
<meta name="description" content="SIP and Lumpsum sales MIS for VRMs and Admin.">
</head>
<body>
<!-- VRM Revenue Dashboard — single-file frontend served by HtmlService -->
<style>
/* ===========================================================================
   VRM Revenue Dashboard — design system
   Visual language: modern fintech / Stripe-style — deep navy ink, blurple
   primary, an angled gradient band, tight geometric type, layered soft
   shadows, crisp hairline borders. All hand-written; no third-party assets.
   =========================================================================== */
:root{
  /* core palette */
  --navy:#0a2540; --navy2:#0e2f50;
  --p:#635bff; --p2:#7a73ff; --p3:#4b45c6;
  --p-soft:#f0f0ff; --p-ink:#3f3ac9;
  --cyan:#00d4ff; --mint:#a6ffcb; --violet:#8f6ed5;
  --a:#09825d; --a2:#24b47e; --a-soft:#e7f7f0;
  --warn:#bb5504; --warn-soft:#fff6e6;
  --dan:#df1b41; --dan-soft:#fdeef1; --ok:#09825d;

  /* surfaces + text */
  --bg:#f6f9fc; --surf:#ffffff; --surf2:#fbfcfe; --line:#e6ebf1; --line2:#eff3f8;
  --ink:#0a2540; --ink2:#425466; --ink3:#8792a2;

  /* Stripe-ish layered shadows */
  --sh:0 2px 5px -1px rgba(50,50,93,.08),0 1px 3px -1px rgba(0,0,0,.05);
  --sh2:0 13px 27px -5px rgba(50,50,93,.14),0 8px 16px -8px rgba(0,0,0,.10);
  --sh3:0 30px 60px -12px rgba(50,50,93,.22),0 18px 36px -18px rgba(0,0,0,.18);
  --shb:0 4px 6px rgba(50,50,93,.11),0 1px 3px rgba(0,0,0,.08);

  --r:8px; --r2:6px; --r3:4px; --topbar:64px; --side:244px;
  --grad:linear-gradient(101deg,#635bff 0%,#00d4ff 52%,#a6ffcb 100%);
}
html[data-t="dark"]{
  --navy:#061726; --navy2:#0a2540;
  --p:#8b85ff; --p2:#a5a0ff; --p3:#635bff;
  --p-soft:#1b1f4a; --p-ink:#c7c4ff;
  --a:#24b47e; --a2:#3ddc9a; --a-soft:#0b2f24;
  --warn:#f7b955; --warn-soft:#2e2109;
  --dan:#ff6b81; --dan-soft:#331119; --ok:#3ddc9a;
  --bg:#04101c; --surf:#0a2540; --surf2:#0d2b49; --line:#1b3a5c; --line2:#16324f;
  --ink:#f6f9fc; --ink2:#adbdcc; --ink3:#7d90a5;
  --sh:0 2px 5px -1px rgba(0,0,0,.45),0 1px 3px -1px rgba(0,0,0,.3);
  --sh2:0 13px 27px -5px rgba(0,0,0,.55),0 8px 16px -8px rgba(0,0,0,.4);
  --sh3:0 30px 60px -12px rgba(0,0,0,.7),0 18px 36px -18px rgba(0,0,0,.5);
  --shb:0 4px 6px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Ubuntu,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  letter-spacing:-.01em; transition:background .3s,color .3s;
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--p);text-decoration:none}
::selection{background:var(--p);color:#fff}
:focus-visible{outline:3px solid rgba(99,91,255,.45);outline-offset:1px;border-radius:var(--r3)}
h1,h2,h3{letter-spacing:-.028em;line-height:1.16}

/* the signature angled gradient band */
.gband{position:absolute;inset:auto 0 0 0;height:44%;
  background:var(--grad);transform:skewY(-9deg);transform-origin:0 100%;
  background-size:200% 100%;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 50%}to{background-position:100% 50%}}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r3);
  background:var(--surf);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13.5px;
  box-shadow:var(--sh);transition:transform .14s cubic-bezier(.2,.9,.25,1),box-shadow .18s,background .18s,border-color .18s,color .18s;
  white-space:nowrap;letter-spacing:-.01em}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh2);color:var(--p);border-color:var(--line)}
.btn:active:not(:disabled){transform:translateY(0);box-shadow:var(--sh)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.pri{background:var(--p);border-color:transparent;color:#fff;box-shadow:var(--shb)}
.btn.pri:hover:not(:disabled){background:var(--p2);color:#fff;box-shadow:var(--sh2)}
.btn.acc{background:var(--a);border-color:transparent;color:#fff;box-shadow:var(--shb)}
.btn.acc:hover:not(:disabled){background:var(--a2);color:#fff;box-shadow:var(--sh2)}
.btn.dan{background:var(--dan);border-color:transparent;color:#fff;box-shadow:var(--shb)}
.btn.dan:hover:not(:disabled){background:#c4173a;color:#fff;box-shadow:var(--sh2)}
.btn.gh{background:transparent;box-shadow:none;border-color:transparent;color:var(--ink2)}
.btn.gh:hover:not(:disabled){background:var(--line2);color:var(--ink);box-shadow:none;transform:none}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.xs{padding:5px 10px;font-size:12px}
.inp{width:100%;padding:10px 12px;border-radius:var(--r3);border:1px solid var(--line);
  background:var(--surf);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.02);
  transition:border-color .16s,box-shadow .16s}
.inp:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(99,91,255,.18)}
.inp::placeholder{color:var(--ink3)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 6px;letter-spacing:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;
  font-weight:600;background:var(--p-soft);color:var(--p-ink);letter-spacing:0;white-space:nowrap}
.pill.ok{background:var(--a-soft);color:var(--ok)}
.pill.lock{background:var(--dan-soft);color:var(--dan)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:-.02em}
.muted{color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--p)}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;
  overflow:hidden;background:var(--navy)}
#login::before{content:"";position:absolute;inset:0;
  background:radial-gradient(1200px 620px at 15% -10%,rgba(99,91,255,.5),transparent 60%),
             radial-gradient(900px 520px at 95% 8%,rgba(0,212,255,.28),transparent 62%)}
#login .gband{height:38%;opacity:.92}
.lbox{width:100%;max-width:430px;position:relative;z-index:2;animation:rise .55s cubic-bezier(.2,.9,.25,1)}
.lhead{text-align:center;margin-bottom:22px}
.lmark{width:52px;height:52px;margin:0 auto 14px;border-radius:12px;display:grid;place-items:center;
  background:#fff;color:var(--p);font-weight:800;font-size:15px;letter-spacing:-.04em;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.4)}
.lhead h1{margin:0;font-size:30px;color:#fff;font-weight:700}
.lhead p{margin:8px 0 0;color:rgba(255,255,255,.72);font-size:15px}
.lcard{padding:26px;border-radius:12px;background:var(--surf);border:1px solid transparent;
  box-shadow:var(--sh3)}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);margin-bottom:20px}
.seg button{flex:1;padding:9px;border-radius:var(--r3);font-weight:600;font-size:13.5px;
  color:var(--ink2);transition:.18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--surf);color:var(--p);box-shadow:var(--sh)}
.err{margin-top:16px;padding:11px 13px;border-radius:var(--r3);background:var(--dan-soft);
  color:var(--dan);font-size:13px;font-weight:500;border-left:3px solid var(--dan);animation:shake .35s}
.lfoot{margin-top:20px;text-align:center;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.75}
.demobox{margin-top:14px;padding:11px 13px;border-radius:var(--r3);background:var(--p-soft);
  color:var(--p-ink);font-size:12.5px;line-height:1.7}

.pwwrap{position:relative}
.pwwrap .inp{padding-right:44px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  display:grid;place-items:center;border-radius:var(--r3);color:var(--ink3);transition:.15s}
.pweye:hover{color:var(--p);background:var(--line2)}
.pweye[aria-pressed="true"]{color:var(--p)}

/* ---------- shell ---------- */
#app{display:none}
.topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar);z-index:40;display:flex;align-items:center;
  gap:12px;padding:0 20px;background:var(--surf);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;inset:auto 0 -3px 0;height:3px;background:var(--grad)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.bmark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--navy);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:-.03em}
.btitle{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.025em}
.btitle span{display:block;font-size:11.5px;font-weight:600;color:var(--p);letter-spacing:.06em;
  text-transform:uppercase}
.iconbtn{width:36px;height:36px;border-radius:var(--r3);display:grid;place-items:center;
  border:1px solid transparent;color:var(--ink2);transition:.16s}
.iconbtn:hover{background:var(--line2);color:var(--p)}
#burger{display:none}
.acct{position:relative}
.acctbtn{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 5px;border-radius:999px;
  border:1px solid var(--line);background:var(--surf);box-shadow:var(--sh);transition:.16s}
.acctbtn:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.av{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:11px;
  font-weight:700;color:#fff;background:var(--grad);flex:0 0 auto}
.acctname{font-size:13.5px;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 10px);min-width:230px;padding:6px;border-radius:var(--r);
  background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh3);display:none;animation:rise .16s}
.menu.open{display:block}
.menu .mh{padding:10px 12px 11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.menu .mh b{display:block;font-size:14px}
.menu .mh small{color:var(--ink3);font-size:12px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r3);
  font-size:13.5px;font-weight:500;text-align:left;color:var(--ink2);transition:.14s}
.menu button:hover{background:var(--p-soft);color:var(--p)}
.menu button.d:hover{background:var(--dan-soft);color:var(--dan)}

.side{position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--side);z-index:35;padding:18px 14px;
  background:var(--surf);border-right:1px solid var(--line);overflow-y:auto;
  transition:transform .28s cubic-bezier(.2,.9,.25,1)}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r2);
  font-size:14px;font-weight:500;color:var(--ink2);text-align:left;transition:.16s;position:relative}
.snav button:hover{background:var(--line2);color:var(--ink)}
.snav button[aria-current="true"]{background:var(--p-soft);color:var(--p);font-weight:600}
.snav .ic{width:18px;flex:0 0 18px;display:grid;place-items:center;opacity:.95}
.sgroup{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
  padding:12px 12px 8px}
.sfoot{margin-top:20px;padding:14px;border-radius:var(--r2);background:var(--bg);
  border:1px solid var(--line);font-size:12px;color:var(--ink2);line-height:1.7}
.sfoot b{color:var(--ink)}
#backdrop{position:fixed;inset:0;background:rgba(10,37,64,.55);z-index:34;display:none;backdrop-filter:blur(3px)}
#backdrop.on{display:block;animation:fade .2s}

main{margin:var(--topbar) 0 0 var(--side);padding:28px;min-height:calc(100vh - var(--topbar))}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.phead h2{margin:0;font-size:27px;font-weight:700}
.phead p{margin:7px 0 0;color:var(--ink2);font-size:14px;max-width:76ch}
.view{animation:rise .32s cubic-bezier(.2,.9,.25,1)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:16px;margin-bottom:22px}
.kpi{padding:20px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line);
  box-shadow:var(--sh);transition:transform .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s;
  position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);
  opacity:0;transition:opacity .22s}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi:hover::before{opacity:1}
.kpi .kt{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink2);
  margin-bottom:12px}
.kpi .ki{width:28px;height:28px;border-radius:var(--r2);display:grid;place-items:center;flex:0 0 auto;
  background:var(--p-soft);color:var(--p)}
.kpi.g2 .ki{background:var(--a-soft);color:var(--a)}
.kpi .kv{font-size:29px;font-weight:700;letter-spacing:-.04em;line-height:1.1;color:var(--ink);
  font-variant-numeric:tabular-nums}
.kpi .ks{margin-top:7px;font-size:12.5px;color:var(--ink3)}

/* ---------- panels / tables ---------- */
.panel{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;margin-bottom:22px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:17px 20px;border-bottom:1px solid var(--line);background:var(--surf)}
.ptop h3{margin:0;font-size:16px;font-weight:600}
.ptop p{margin:4px 0 0;font-size:12.5px;color:var(--ink3)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;min-width:210px}
.search .inp{padding-left:36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none}
.twrap{overflow:auto;max-height:min(66vh,740px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{position:sticky;top:0;z-index:2;background:var(--surf2);text-align:left;padding:11px 20px;
  font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:13px 20px;border-bottom:1px solid var(--line2);vertical-align:middle;color:var(--ink2)}
tbody td b,tbody td .mono b{color:var(--ink)}
tbody tr{transition:background .13s}
tbody tr:hover{background:var(--surf2)}
tbody tr.sel{background:var(--p-soft)}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{font-weight:700;color:var(--ink)}
tfoot td{padding:14px 20px;background:var(--surf2);border-top:2px solid var(--line);font-weight:700;
  color:var(--ink);position:sticky;bottom:0;z-index:2}
.empty{padding:60px 24px;text-align:center;color:var(--ink3)}
.empty .eic{width:52px;height:52px;margin:0 auto 14px;border-radius:12px;display:grid;place-items:center;
  background:var(--bg);border:1px solid var(--line);color:var(--ink3)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:15px}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:var(--p-soft);border-bottom:1px solid var(--line);animation:fade .2s}
.selbar b{color:var(--p-ink)}
.conf{display:inline-flex;gap:6px;align-items:center;animation:rise .18s}
.cx{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--p);cursor:pointer}

/* ---------- chart ---------- */
.chartbox{padding:20px;height:330px;position:relative}
.legend{display:flex;gap:18px;padding:0 20px 18px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px}
.bars{display:flex;align-items:flex-end;gap:10px;height:236px;padding:0 4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.bstack{width:100%;max-width:54px;display:flex;flex-direction:column-reverse;justify-content:flex-start;
  height:200px;gap:2px;position:relative}
.bseg{width:100%;border-radius:3px;height:0;transition:height .8s cubic-bezier(.2,.9,.25,1)}
.blab{font-size:11px;color:var(--ink3);font-weight:600;white-space:nowrap}
.bcol:hover .bseg{filter:brightness(1.1)}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(10,37,64,.6);backdrop-filter:blur(4px)}
#modal.on{display:flex;animation:fade .18s}
.mbox{width:100%;max-width:470px;max-height:92vh;overflow:auto;padding:26px;border-radius:12px;
  background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh3);
  animation:rise .26s cubic-bezier(.2,.9,.25,1)}
.mbox h3{margin:0 0 6px;font-size:20px;font-weight:700}
.mbox .msub{margin:0 0 20px;font-size:13.5px;color:var(--ink2);line-height:1.6}
.f{margin-bottom:15px}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px;
  max-width:min(400px,calc(100vw - 40px))}
.toast{display:flex;gap:11px;padding:14px 16px;border-radius:var(--r);background:var(--surf);
  border:1px solid var(--line);box-shadow:var(--sh3);font-size:13.5px;font-weight:500;color:var(--ink);
  animation:tin .32s cubic-bezier(.2,.9,.25,1);border-left:3px solid var(--ok);line-height:1.5}
.toast.e{border-left-color:var(--dan)}
.toast.i{border-left-color:var(--p)}
.toast.out{animation:tout .25s forwards}
.toast .tic{flex:0 0 auto;color:var(--ok);margin-top:1px}
.toast.e .tic{color:var(--dan)} .toast.i .tic{color:var(--p)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:90;background:var(--grad);
  transition:width .3s ease,opacity .3s;opacity:0}
#bar.on{opacity:1}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;
  display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}

/* demo banner (GitHub Pages build only) */
#demobar{position:fixed;top:0;left:0;right:0;z-index:95;padding:7px 16px;text-align:center;
  background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.01em}
#demobar a{color:var(--mint)}
body.hasdemo .topbar{top:32px}
body.hasdemo .side{top:calc(var(--topbar) + 32px)}
body.hasdemo main{margin-top:calc(var(--topbar) + 32px)}


/* ---------- waterfall + status ---------- */
.wf{padding:18px 20px 20px}
.wfrow{display:flex;align-items:center;gap:14px;padding:7px 0}
.wfrow.wftot{border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.wflab{width:130px;flex:0 0 130px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.wfrow.wftot .wflab{color:var(--ink);font-weight:700}
.wfbar{flex:1;height:20px;background:var(--line2);border-radius:5px;overflow:hidden;min-width:60px}
.wfbar>div{height:100%;border-radius:5px;transition:width .7s cubic-bezier(.2,.9,.25,1)}
.wf-sip{background:var(--p)} .wf-lump{background:var(--p2)}
.wf-gross{background:var(--grad)} .wf-red{background:var(--dan)}
.wf-net{background:linear-gradient(90deg,var(--a),var(--a2))}

  font-size:14px;font-weight:600;color:var(--ink)}
.wfrow.wftot .wfval{font-weight:800;font-size:15.5px}
.wfval.neg,.neg{color:var(--dan)}
.wfsum{margin-top:16px;padding:13px 15px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r2);font-size:14px;color:var(--ink2);text-align:center;line-height:2}
.wfsum b{color:var(--ink)} .wfsum .netbig{color:var(--a);font-size:17px}
.kpi.net{border-color:var(--a)} .kpi.net .ki{background:var(--a-soft);color:var(--a)}
.kpi.net .kv{color:var(--a)}
.kpi.red .ki{background:var(--dan-soft);color:var(--dan)}
.kpi.red .kv{color:var(--dan)}
.navbadge{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;
  padding:1px 7px;font-size:11px;font-weight:700;line-height:1.5}
.kpi.ytd{background:var(--surf2)}
.kpi.ytd .kt{color:var(--ink3)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:18px 20px}
.statbox{padding:15px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surf2)}
.statbox .sl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.statbox .sv{font-size:21px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.statbox .sn{margin-top:5px;font-size:11.5px;color:var(--ink3)}
.statbox.ok{border-left:3px solid var(--ok)} .statbox.ok .sv{color:var(--ok)}
.statbox.warn{border-left:3px solid var(--warn)} .statbox.warn .sv{color:var(--warn)}
.statbox.dan{border-left:3px solid var(--dan)} .statbox.dan .sv{color:var(--dan)}
.statbox.net{border-left:3px solid var(--a);background:var(--a-soft)} .statbox.net .sv{color:var(--a)}
.metricToggles{display:flex;gap:7px;flex-wrap:wrap;padding:0 20px 14px}
.metricToggles button{padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surf);font-size:12px;font-weight:600;color:var(--ink3)}
.metricToggles button[aria-pressed="true"]{color:#fff;border-color:transparent}
.uperr{margin-top:14px;max-height:190px;overflow:auto;padding:12px 14px;border-radius:var(--r2);
  background:var(--dan-soft);border-left:3px solid var(--dan);font-size:12.5px;line-height:1.75}
.uperr b{color:var(--dan)}
.uperr ol{margin:6px 0 0;padding-left:20px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

@media (max-width:900px){
  #burger{display:grid}

  .lhead h1{font-size:25px}

    var dim = [31, (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28,

 * file. So the order is inferred from the FILE rather than assumed:
 *
 *   a value whose first part is > 12  can only be day-first  (17-08-2026)
 *   a value whose second part is > 12 can only be month-first (08-17-2026)
 *
 * One unambiguous row settles it for the rest. If a file contains both, that is
 * a genuine contradiction and it is reported instead of picked over.
 * ========================================================================== */

      .match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/);

  m = str.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/);

  var y = m[3].length === 2 ? 2000 + num(m[3]) : num(m[3]);

  var dim = [31, ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 29 : 28,

  $('mbox').innerHTML = '<h3>' + esc(title) + '</h3>' +
    (sub ? '<p class="msub">' + sub + '</p>' : '') + bodyHtml +
    '<div class="mact">' + actions + '</div>';
  $('modal').classList.add('on');
  setTimeout(function () {
    var f = $('mbox').querySelector('input:not([type=hidden]),select,textarea');
    if (f) f.focus();
  }, 60);
}
function closeModal() { $('modal').classList.remove('on'); $('mbox').innerHTML = ''; }
$('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal(); $('acctMenu').classList.remove('open'); }
});

function setLoginRole(role) {
  S.loginRole = role;
  $('tabVrm').setAttribute('aria-selected', role === 'VRM' ? 'true' : 'false');
  $('tabAdm').setAttribute('aria-selected', role === 'ADMIN' ? 'true' : 'false');
  $('vrmPick').style.display = role === 'VRM' ? '' : 'none';
  $('lforgotwrap').style.display = role === 'VRM' ? '' : 'none';
  $('ldemo').style.display = 'none';
  $('lerr').style.display = 'none';
  $('lpw').value = '';
  setPwVisible(false);
  setTimeout(function () { (role === 'VRM' ? $('lvrm') : $('lpw')).focus(); }, 40);
}
$('tabVrm').onclick = function () { setLoginRole('VRM'); };
$('tabAdm').onclick = function () { setLoginRole('ADMIN'); };

/*
 * "Forgot password?" records a request for the admin — it never changes a
 * password. This endpoint is reachable without signing in, so resetting a
 * credential here would hand any account to anyone who knows an emp code.
 */
$('lforgot').onclick = function () {
  var code = $('lvrm').value;
  if (!code) return loginErr('Pick your name first, then tap Forgot password.');
  var un = lock($('lforgot'), 'Sending');
  api('requestPasswordReset', code).then(function (d) {
    un();
    $('lerr').style.display = 'none';
    var box = $('ldemo');
    box.style.display = '';
    box.innerHTML = '<b>Request sent</b><br>' + esc(d.message);
  }).catch(function (e) { un(); loginErr(e.message); });
};

function loadVrmList() {
  api('bootstrap').then(function (d) {
    /* Visible before anyone signs in, because a stale deployment is exactly the
       thing you want to notice BEFORE spending ten minutes on an upload. */
    var lb = $('loginBuild');
    if (lb) lb.textContent = d.build ? 'server build ' + d.build : 'server build unknown (old deployment)';
    var sel = $('lvrm'), list = d.vrms || [];
    if (!list.length) { sel.innerHTML = '<option value="">No VRMs found in the sheet</option>'; return; }
    /* Duplicate names are disambiguated by emp code, e.g. "Pavan Soni (VRM002)". */
    sel.innerHTML = '<option value="">- choose your name -</option>' + list.map(function (v) {
      return '<option value="' + esc(v.empCode) + '">' + esc(v.name) + ' (' + esc(v.empCode) + ')' +
             (v.locked ? ' - LOCKED' : '') + '</option>';
    }).join('');
  }).catch(function (e) {
    $('lvrm').innerHTML = '<option value="">Could not load VRM list</option>';
    loginErr(e.message);
  });
}

$('lform').onsubmit = function (ev) {
  ev.preventDefault();
  var pw = $('lpw').value;
  var code = S.loginRole === 'VRM' ? $('lvrm').value : null;
  $('lerr').style.display = 'none';
  if (S.loginRole === 'VRM' && !code) return loginErr('Please select your name from the list.');
  if (!pw) return loginErr('Please enter your password.');

  var un = lock($('lgo'), 'Signing in');
  api('login', S.loginRole, code, pw).then(function (out) {
    S.session = out.session; S.data = out.data;
    $('lpw').value = '';
    un();
    enterApp();
  }).catch(function (e) {
    un(); loginErr(e.message);
    $('lpw').select();
    if (/locked/i.test(e.message)) loadVrmList();
  });
};
loadVrmList();

 * empty tab is furniture people learn to ignore; one that shows up with a count

  out.splice(at, 0, { id: 'unassigned', label: 'Unassigned', ic: IC.users, badge: n });

/* ======================= SHARED CALCULATIONS ============================== *
 *
 * The client mirror of the server's business logic. Every figure on every screen
 * comes from metrics() so the definitions cannot drift between components:
 *
 *   SIP        = sum(Amount) where TxnType = SIP        and the status counts
 *   LUMPSUM    = sum(Amount) where TxnType = LUMPSUM    and the status counts
 *   REDEMPTION = sum(Amount) where TxnType = REDEMPTION and the status counts
 *   GROSS      = SIP + LUMPSUM              (redemption deliberately excluded)
 *   NET        = GROSS - REDEMPTION
 *
 * Which statuses count is decided by the server (Config: COUNTED_STATUSES,
 * default COMPLETED) and travels in the payload, so the rule is set in one place.
 * ========================================================================== */

var TT = { SIP: 'SIP', LUMPSUM: 'LUMPSUM', REDEMPTION: 'REDEMPTION' };
var TS = { COMPLETED: 'COMPLETED', IN_PROCESS: 'IN_PROCESS', REJECTED: 'REJECTED' };

var TT_LABEL = { SIP: 'SIP', LUMPSUM: 'Lumpsum', REDEMPTION: 'Redemption' };
var TS_LABEL = { COMPLETED: 'Completed', IN_PROCESS: 'In Process', REJECTED: 'Rejected' };

/* How "New client transactions" is counted. One constant, easy to switch. */
var NEW_CLIENT_BASIS = 'FIRST_EVER_IN_REF_MONTH';

function countedSet() {
  var list = (S.data && S.data.config && S.data.config.countedStatuses) || ['COMPLETED'];
  var o = {};
  list.forEach(function (x) { o[x] = true; });
  return o;
}
function isCounted(t) { return !!countedSet()[t.status]; }

/** A purchase, i.e. something that adds business rather than removing it. */
function isPurchase(t) { return t.txnType === TT.SIP || t.txnType === TT.LUMPSUM; }

/*
 * Rows an admin has marked as not-a-person. They stay in the data for the audit
 * trail but leave every figure — including the unassigned percentage — because
 * "Test" inflating the queue was the whole reason exclusions exist.
 */
/*
 * The name to SHOW for a row. vrmEmpCode is the identity; the row's own text is
 * whatever the file happened to write, kept for provenance. Resolving through
 * the roster means one person reads one way in every table, and a rename shows
 * up everywhere at once without touching a single transaction row.
 */
function vrmNameOf(t) {
  if (!t.vrmEmpCode) return t.vrm || '';
  var list = (S.data && S.data.vrms) || [];
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].empCode).toUpperCase() === String(t.vrmEmpCode).toUpperCase()) {
      return list[i].name;
    }
  }
  return t.vrm || t.vrmEmpCode;
}

function liveRows(txns) {
  return (txns || []).filter(function (t) { return !t.excluded; });
}

function metrics(txns) {
  txns = liveRows(txns);
  var counted = countedSet();
  var m = { sip: 0, lumpsum: 0, redemption: 0, gross: 0, net: 0,
            pending: 0, rejected: 0, txns: 0, countedTxns: 0,
            pendingTxns: 0, rejectedTxns: 0 };
  (txns || []).forEach(function (t) {
    var amt = num(t.amount);
    m.txns++;
    /* Pending and rejected are tracked separately so they stay visible without
       ever leaking into the finalised figures. */
    if (t.status === TS.IN_PROCESS) { m.pendingTxns++; if (isPurchase(t)) m.pending += amt; }
    if (t.status === TS.REJECTED) { m.rejectedTxns++; m.rejected += amt; }
    if (!counted[t.status]) return;
    m.countedTxns++;
    if (t.txnType === TT.SIP) m.sip += amt;
    else if (t.txnType === TT.LUMPSUM) m.lumpsum += amt;
    else if (t.txnType === TT.REDEMPTION) m.redemption += amt;
  });
  m.gross = m.sip + m.lumpsum;
  m.net = m.gross - m.redemption;
  return m;
}

/** Distinct client codes, regardless of status. */
function clientCount(txns) {
  return uniq((txns || []).map(function (t) {
    return String(t.clientCode || '').toUpperCase();
  }).filter(Boolean)).length;
}

/**
 * KPIs for a set of transactions. The reference month/year comes from the LATEST
 * TxnDate present, not today's date, so loading historic data shows that period
 * rather than an empty current month.
 */
function kpis(txns) {
  var dated = (txns || []).filter(function (t) { return t.date; });
  var latest = '';
  dated.forEach(function (t) { if (t.date > latest) latest = t.date; });

  var refMonth = latest ? latest.slice(0, 7) : '';
  var refYear = latest ? latest.slice(0, 4) : '';

  var monthTx = dated.filter(function (t) { return t.date.slice(0, 7) === refMonth; });
  var yearTx = dated.filter(function (t) { return t.date.slice(0, 4) === refYear; });

  var mm = metrics(monthTx), my = metrics(yearTx), all = metrics(txns);

  /* First-ever PURCHASE per client — a redemption does not make someone a new
     client, and a rejected transaction never happened. */
  var first = {};
  dated.forEach(function (t) {
    if (!isPurchase(t) || !isCounted(t)) return;
    var c = String(t.clientCode || '').toUpperCase();
    if (!c) return;
    if (!first[c] || t.date < first[c]) first[c] = t.date;
  });
  var newClients = 0;
  Object.keys(first).forEach(function (c) {
    if (NEW_CLIENT_BASIS === 'FIRST_EVER_IN_REF_MONTH' && first[c].slice(0, 7) === refMonth) newClients++;
  });

  return {
    latest: latest, refMonth: refMonth, refYear: refYear,
    refLabel: refMonth ? monLabel(refMonth) : 'no data yet',
    month: mm, year: my, all: all,
    clients: clientCount(txns),
    clientsMonth: clientCount(monthTx),
    newClients: newClients,
    txns: (txns || []).length
  };
}

/** One row per month present, most recent 12, with every metric. */
function monthly(txns) {
  var m = {};
  (txns || []).forEach(function (t) {
    if (!t.date) return;
    var k = t.date.slice(0, 7);
    if (!m[k]) m[k] = [];
    m[k].push(t);
  });
  return Object.keys(m).sort().slice(-12).map(function (k) {
    var mx = metrics(m[k]);
    mx.key = k;
    mx.clients = clientCount(m[k]);
    return mx;
  });
}

/** One row per client code. */
function byClient(txns) {
  var m = {};
  (txns || []).forEach(function (t) {
    var k = String(t.clientCode || '').toUpperCase();
    if (!k) return;
    if (!m[k]) m[k] = { clientCode: t.clientCode, clientName: t.clientName, pan: t.pan,
                        panMasked: t.panMasked, rows: [], vrms: [], rms: [],
                        first: t.date, last: t.date };
    var r = m[k];
    r.rows.push(t);
    if (t.clientName && !r.clientName) r.clientName = t.clientName;
    if (t.pan && !r.pan) { r.pan = t.pan; r.panMasked = t.panMasked; }
    if (t.vrmEmpCode && r.vrms.indexOf(t.vrmEmpCode) < 0) r.vrms.push(t.vrmEmpCode);
    if (t.rmName && r.rms.indexOf(t.rmName) < 0) r.rms.push(t.rmName);
    if (t.date && (!r.first || t.date < r.first)) r.first = t.date;
    if (t.date && (!r.last || t.date > r.last)) r.last = t.date;
  });
  return Object.keys(m).map(function (k) {
    var r = m[k];
    var mx = metrics(r.rows);
    r.sip = mx.sip; r.lumpsum = mx.lumpsum; r.redemption = mx.redemption;
    r.gross = mx.gross; r.net = mx.net; r.n = r.rows.length;
    r.pending = mx.pending; r.rejected = mx.rejected;
    return r;
  }).sort(function (a, b) { return b.net - a.net; });
}

/** One row per VRM. */
function byVrm(txns, vrms) {
  var m = {};
  (vrms || []).forEach(function (v) {
    m[v.empCode.toUpperCase()] = { empCode: v.empCode, name: v.name, rows: [], clients: {}, rms: [] };
  });
  (txns || []).forEach(function (t) {
    /* Every unassigned row shares one bucket, whatever the file called them, so
       the VRM-wise page still adds up to the firm total. */
    var k = t.vrmEmpCode ? String(t.vrmEmpCode).toUpperCase() : '(UNASSIGNED)';
    if (!m[k]) m[k] = { empCode: t.vrmEmpCode || '—', name: t.vrmEmpCode ? vrmNameOf(t) : 'Unassigned',
                        unassigned: !t.vrmEmpCode, rows: [], clients: {}, rms: [] };
    var r = m[k];
    r.rows.push(t);
    if (t.clientCode) r.clients[String(t.clientCode).toUpperCase()] = 1;
    if (t.rmName && r.rms.indexOf(t.rmName) < 0) r.rms.push(t.rmName);
  });
  return Object.keys(m).map(function (k) {
    var r = m[k];
    var mx = metrics(r.rows);
    r.sip = mx.sip; r.lumpsum = mx.lumpsum; r.redemption = mx.redemption;
    r.gross = mx.gross; r.net = mx.net;
    r.pending = mx.pending; r.rejected = mx.rejected;
    r.n = r.rows.length;
    r.clientCount = Object.keys(r.clients).length;
    return r;
  }).sort(function (a, b) { return b.net - a.net; });
}

/** One row per scheme (admin analysis). */
function byScheme(txns) {
  var m = {};
  (txns || []).forEach(function (t) {
    var k = String(t.scheme || '(not supplied)').toUpperCase();
    if (!m[k]) m[k] = { scheme: t.scheme || '(not supplied)', rows: [], clients: {} };
    m[k].rows.push(t);
    if (t.clientCode) m[k].clients[String(t.clientCode).toUpperCase()] = 1;
  });
  return Object.keys(m).map(function (k) {
    var r = m[k];
    var mx = metrics(r.rows);
    r.sip = mx.sip; r.lumpsum = mx.lumpsum; r.redemption = mx.redemption;
    r.gross = mx.gross; r.net = mx.net; r.n = r.rows.length;
    r.clientCount = Object.keys(r.clients).length;
    return r;
  }).sort(function (a, b) { return b.gross - a.gross; });
}

/** Search across every column a user can see. */
function matches(t, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return [t.clientCode, t.clientName, t.pan, t.vrm, vrmNameOf(t), t.vrmEmpCode, t.rmName, t.scheme,
          TT_LABEL[t.txnType] || t.txnType, TS_LABEL[t.status] || t.status,
          t.reason, dmy(t.date), t.date, hhmm(t.time), String(t.amount), t.batchId]
    .some(function (f) { return String(f || '').toLowerCase().indexOf(q) >= 0; });
}

/* --------------------------- display helpers ------------------------------ */

/** 24h "13:47" -> "01:47 PM" for display; storage stays 24h so sorting works. */
function hhmm(t) {
  var m = String(t || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return '';
  var h = num(m[1]), ap = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return ('0' + h12).slice(-2) + ':' + m[2] + ' ' + ap;
}

function typePill(t) {
  var cls = t === TT.REDEMPTION ? 'warn' : (t === TT.SIP ? '' : 'ok');
  return '<span class="pill ' + cls + '">' + esc(TT_LABEL[t] || t || '?') + '</span>';
}

function statusPill(st) {

  return '<span class="pill ' + cls + '">' + esc(TS_LABEL[st] || st || '?') + '</span>';

/** Signed amount: a redemption is money leaving, so it reads as negative. */

/* ============================== WATERFALL ================================= *
 * SIP + Lumpsum = Gross, minus Redemption = Net. The whole point is that the
 * arithmetic is visible, so the bars are proportional and the maths is spelled
 * out underneath rather than left implied.
 * ========================================================================== */
function waterfall(m, title) {
  var max = Math.max(m.sip + m.lumpsum, m.gross, Math.abs(m.net), m.redemption, 1);
  var pctOf = function (v) { return Math.max(1.5, Math.abs(v) / max * 100); };

  var bars = [
    { label: 'SIP', v: m.sip, cls: 'wf-sip' },
    { label: 'Lumpsum', v: m.lumpsum, cls: 'wf-lump' },
    { label: 'Gross Sales', v: m.gross, cls: 'wf-gross', rule: true },
    { label: 'Redemption', v: -m.redemption, cls: 'wf-red' },
    { label: 'Net Sales', v: m.net, cls: 'wf-net', rule: true }
  ];

  return '<div class="panel">' +
    '<div class="ptop"><div><h3>' + esc(title || 'How the business adds up') + '</h3></div></div>' +
    '<div class="wf">' +
      bars.map(function (b) {
        return '<div class="wfrow' + (b.rule ? ' wftot' : '') + '">' +
          '<div class="wflab">' + esc(b.label) + '</div>' +
          '<div class="wfbar"><div class="' + b.cls + '" style="width:' + pctOf(b.v).toFixed(1) + '%"></div></div>' +
          '<div class="wfval' + (b.v < 0 ? ' neg' : '') + '">' +
            (b.v < 0 ? '− ' : '') + rupee(Math.abs(b.v)) + '</div></div>';
      }).join('') +
      '<div class="wfsum">' +
        '<span>' + rupee(m.sip) + '</span> + <span>' + rupee(m.lumpsum) + '</span>' +
        ' = <b>' + rupee(m.gross) + '</b> − <span class="neg">' + rupee(m.redemption) + '</span>' +
        ' = <b class="netbig">' + rupee(m.net) + '</b>' +
      '</div>' +
    '</div></div>';
}

/* Pending / rejected, kept visible but plainly outside the finalised figures. */
function statusStrip(m) {
  var counted = countedSet();
  var note = Object.keys(counted).map(function (k) { return TS_LABEL[k] || k; }).join(' + ');
  return '<div class="panel"><div class="ptop"><div><h3>Transaction status</h3>' +
    '<p>Counting ' + esc(note) + ' towards business figures</p></div></div>' +
    '<div class="statgrid">' +
      '<div class="statbox ok"><div class="sl">Counted business</div><div class="sv">' + rupee(m.gross) + '</div>' +
        '<div class="sn">' + m.countedTxns + ' transaction(s)</div></div>' +
      '<div class="statbox warn"><div class="sl">In Process (pending)</div><div class="sv">' + rupee(m.pending) + '</div>' +
        '<div class="sn">' + m.pendingTxns + ' transaction(s) — not in Gross</div></div>' +
      '<div class="statbox dan"><div class="sl">Rejected</div><div class="sv">' + rupee(m.rejected) + '</div>' +
        '<div class="sn">' + m.rejectedTxns + ' transaction(s) — excluded</div></div>' +
      '<div class="statbox net"><div class="sl">Final Net Sales</div><div class="sv">' + rupee(m.net) + '</div>' +
        '<div class="sn">Gross − Redemption</div></div>' +
    '</div></div>';
}

/* Count-up animation on load / refresh. */
function animateCounts() {
  var els = document.querySelectorAll('.kv[data-count]');
  Array.prototype.forEach.call(els, function (el) {
    var target = num(el.dataset.count), plain = el.dataset.plain === '1';
    var dur = 780, t0 = 0, done = false;
    function fmt(v) { return plain ? inr(Math.round(v)) : rupee(Math.round(v)); }
    if (!target) { el.textContent = fmt(0); return; }
    function step(ts) {
      if (done) return;
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      el.textContent = fmt(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step); else done = true;
    }
    requestAnimationFrame(step);
    /* Safety net: requestAnimationFrame is paused in background tabs, so make
       sure the real number is on screen either way. */
    setTimeout(function () {
      if (!done) { done = true; el.textContent = fmt(target); }
    }, dur + 220);
  });
}

/* ================================ CHARTS ================================= */
/* Chart.js when the CDN is reachable, hand-drawn CSS bars when it is not. */

function drawChart(id, labels, seriesA, seriesB, names) {
  var box = $(id + '_box');
  if (!box) return;
  var ink = getComputedStyle(document.documentElement).getPropertyValue('--ink2').trim() || '#4b5164';
  var line = getComputedStyle(document.documentElement).getPropertyValue('--line').trim() || '#e6e8f0';
  var p = getComputedStyle(document.documentElement).getPropertyValue('--p').trim() || '#4f46e5';
  var a = getComputedStyle(document.documentElement).getPropertyValue('--dan').trim() || '#df1b41';
  var surf = getComputedStyle(document.documentElement).getPropertyValue('--surf').trim() || '#fff';

  if (!window.Chart) return fallbackBars(box, labels, seriesA, seriesB, p, a);

  var cv = $(id);
  if (!cv) return;
  if (window._charts && window._charts[id]) { try { window._charts[id].destroy(); } catch (e) {} }
  window._charts = window._charts || {};
  window._charts[id] = new Chart(cv.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: (names && names[0]) || 'A', data: seriesA, backgroundColor: p, borderRadius: 5, maxBarThickness: 42 },
        { label: (names && names[1]) || 'B', data: seriesB, backgroundColor: a, borderRadius: 5, maxBarThickness: 42 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 850, easing: 'easeOutQuart' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: surf, titleColor: ink, bodyColor: ink, borderColor: line, borderWidth: 1,
          padding: 10, cornerRadius: 8, displayColors: true,
          callbacks: { label: function (c) { return c.dataset.label + ': ' + rupee(c.parsed.y); } }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: ink, font: { size: 11 } }, border: { color: line } },
        y: {
          grid: { color: line }, border: { display: false },
          ticks: { color: ink, font: { size: 11 }, callback: function (v) { return shortInr(v); } }
        }
      }
    }
  });
}

function fallbackBars(box, labels, sip, lump, p, a) {
  var max = 1;
  labels.forEach(function (_, i) { max = Math.max(max, num(sip[i]) + num(lump[i])); });
  box.innerHTML = '<div class="bars">' + labels.map(function (l, i) {
    var hs = Math.round(num(sip[i]) / max * 190), hl = Math.round(num(lump[i]) / max * 190);
    return '<div class="bcol" title="' + esc(l) + ' - SIP ' + rupee(sip[i]) + ' / Lumpsum ' + rupee(lump[i]) + '">' +
      '<div class="bstack">' +
        '<div class="bseg" style="background:' + p + '" data-h="' + hs + '"></div>' +
        '<div class="bseg" style="background:' + a + '" data-h="' + hl + '"></div>' +
      '</div><div class="blab">' + esc(l) + '</div></div>';
  }).join('') + '</div>';
  setTimeout(function () {
    Array.prototype.forEach.call(box.querySelectorAll('.bseg'), function (s) {
      s.style.height = s.dataset.h + 'px';
    });
  }, 40);
}

function emptyState(title, sub) {
  return '<div class="empty"><div class="eic">' + IC.layers + '</div><b>' + esc(title) + '</b>' +
         '<span>' + esc(sub) + '</span></div>';
}

/* ============================ MONTHLY TREND =============================== *
 * Five series at once is unreadable, so the default is the three that answer
 * "how are we doing" — Gross, Redemption, Net — with SIP and Lumpsum available
 * as toggles rather than always on.
 * ========================================================================== */
var TREND_SERIES = [
  { key: 'gross',      label: 'Gross Sales', color: 'var(--p)',   raw: '#635bff' },
  { key: 'redemption', label: 'Redemption',  color: 'var(--dan)', raw: '#df1b41' },
  { key: 'net',        label: 'Net Sales',   color: 'var(--a)',   raw: '#09825d' },

  { key: 'lumpsum',    label: 'Lumpsum',     color: 'var(--cyan)', raw: '#00b8d9' }
];

S.trendOn = { gross: true, redemption: true, net: true, sip: false, lumpsum: false };

function trendPanel(id, m) {
  return '<div class="panel"><div class="ptop"><div><h3>Monthly trend</h3></div></div>' +
    (m.length
      ? '<div class="metricToggles">' + TREND_SERIES.map(function (sr) {

/** Multi-series monthly chart honouring the toggles. */
function drawTrend(id, m) {
  var box = $(id + '_box');

          maxBarThickness: 38,
          tension: 0.3,
          pointRadius: isLine ? 3 : 0,
          fill: false,
          order: isLine ? 0 : 1
        };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 800, easing: 'easeOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: true, position: 'bottom',
                  labels: { color: ink, boxWidth: 12, font: { size: 12 } } },
        tooltip: {
          backgroundColor: surf, titleColor: ink, bodyColor: ink,
          borderColor: line, borderWidth: 1, padding: 10, cornerRadius: 8,
          callbacks: { label: function (c) { return c.dataset.label + ': ' + rupee(c.parsed.y); } }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: ink, font: { size: 11 } }, border: { color: line } },
        y: { grid: { color: line }, border: { display: false },
             ticks: { color: ink, font: { size: 11 },
                      callback: function (v) { return shortInr(v); } } }
      }
    }
  });
}

function cssVar(name, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;

}

/* --------------------------- ADMIN: VRM-wise ------------------------------ */
function viewVrmwise() {
  var q = (S.q.vrmwise || '').toLowerCase();
  var sortKey = S.vrmSort || 'net';
  var rows = byVrm(S.data.txns, S.data.vrms).filter(function (r) {
    return !q || (r.empCode + ' ' + r.name + ' ' + r.rms.join(' ')).toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) {
    if (sortKey === 'clients') return b.clientCount - a.clientCount;
    if (sortKey === 'txns') return b.n - a.n;
    return num(b[sortKey]) - num(a[sortKey]);
  });

  var top = rows.filter(function (r) { return r.n > 0; }).slice(0, 12);
  after(function () {
    drawChart('c2', top.map(function (r) { return r.empCode; }),
      top.map(function (r) { return r.gross; }),
      top.map(function (r) { return r.redemption; }),
      ['Gross Sales', 'Redemption']);
  });

  var tot = { sip: 0, lumpsum: 0, redemption: 0, gross: 0, net: 0, n: 0 };
  rows.forEach(function (r) {
    tot.sip += r.sip; tot.lumpsum += r.lumpsum; tot.redemption += r.redemption;
    tot.gross += r.gross; tot.net += r.net; tot.n += r.n;
  });

  var SORTS = [['net', 'Net Sales'], ['gross', 'Gross Sales'], ['sip', 'SIP'],
               ['lumpsum', 'Lumpsum'], ['redemption', 'Redemption'],
               ['clients', 'Clients'], ['txns', 'Transactions']];

  return pageHead('VRM-wise summary', rows.length + ' VRMs', '') +
    '<div class="panel"><div class="ptop"><div><h3>VRM comparison</h3></div></div>' +
    (top.length
      ? '<div class="chartbox" id="c2_box"><canvas id="c2"></canvas></div>' +
        '<div class="legend"><i style="background:var(--p)"></i>Gross Sales' +
        '<i style="background:var(--dan);margin-left:16px"></i>Redemption</div>'
      : emptyState('Nothing to chart', 'No VRM activity yet.')) + '</div>' +
    '<div class="panel"><div class="ptop"><div><h3>Per-VRM performance</h3></div>' +
    '<div class="tools">' +
      '<span class="muted" style="font-size:12px">Sort by</span>' +
      '<select class="inp" data-sort="vrm" style="width:auto;padding:6px 10px;font-size:12.5px">' +
      SORTS.map(function (kv) {
        return '<option value="' + kv[0] + '"' + (sortKey === kv[0] ? ' selected' : '') + '>' + kv[1] + '</option>';
      }).join('') + '</select>' +
      searchBox('vrmwise', 'Search VRM…') + expBtns('vrmwise') + '</div></div>' +
    '<div class="twrap"><table><thead><tr><th>#</th><th>VRM</th><th>RM Name(s)</th>' +
    '<th class="num">Clients</th><th class="num">SIP</th><th class="num">Lumpsum</th>' +
    '<th class="num">Gross</th><th class="num">Redemption</th><th class="num">Net Sales</th>' +
    '<th class="num">Txns</th><th class="num">Share of Net</th></tr></thead><tbody>' +
    (rows.length ? rows.map(function (r, i) {
      var share = tot.net > 0 ? (r.net / tot.net * 100) : 0;
      return '<tr><td class="muted">' + (i + 1) + '</td>' +
        '<td><b>' + esc(r.name) + '</b><div class="mono muted" style="font-size:11.5px">' + esc(r.empCode) + '</div></td>' +
        '<td style="font-size:12px">' + esc(r.rms.slice(0, 3).join(', ') || '—') +
          (r.rms.length > 3 ? ' <span class="muted">+' + (r.rms.length - 3) + '</span>' : '') + '</td>' +
        '<td class="num">' + r.clientCount + '</td>' +
        '<td class="num">' + rupee(r.sip) + '</td><td class="num">' + rupee(r.lumpsum) + '</td>' +
        '<td class="num tot">' + rupee(r.gross) + '</td>' +
        '<td class="num" style="color:var(--dan)">' + (r.redemption ? '−' + rupee(r.redemption) : rupee(0)) + '</td>' +
        '<td class="num tot" style="color:var(--a)">' + rupee(r.net) + '</td>' +
        '<td class="num">' + r.n + '</td>' +
        '<td class="num">' + share.toFixed(1) + '%</td></tr>';
    }).join('') : '<tr><td colspan="11" class="empty">No VRMs match that search.</td></tr>') +
    '</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">' + clientCount(S.data.txns) + '</td>' +
    '<td class="num">' + rupee(tot.sip) + '</td><td class="num">' + rupee(tot.lumpsum) + '</td>' +
    '<td class="num">' + rupee(tot.gross) + '</td>' +
    '<td class="num" style="color:var(--dan)">−' + rupee(tot.redemption) + '</td>' +
    '<td class="num" style="color:var(--a)">' + rupee(tot.net) + '</td>' +
    '<td class="num">' + tot.n + '</td><td class="num">100%</td></tr></tfoot></table></div></div>';
}

function viewScheme() {
  var q = (S.q.scheme || '').toLowerCase();
  var fType = S.fType || '', fStatus = S.fStatus || '', fVrm = S.fVrm || '';
  var scoped = S.data.txns.filter(function (t) {
    if (fType && t.txnType !== fType) return false;
    if (fStatus && t.status !== fStatus) return false;
    if (fVrm && String(t.vrmEmpCode).toUpperCase() !== fVrm.toUpperCase()) return false;
    return true;
  });
  var rows = byScheme(scoped).filter(function (r) {
    return !q || r.scheme.toLowerCase().indexOf(q) >= 0;
  });
  var top = rows.slice(0, 12);
  after(function () {
    drawChart('c3', top.map(function (r) { return r.scheme.slice(0, 22); }),
      top.map(function (r) { return r.gross; }),
      top.map(function (r) { return r.redemption; }),

/*
 * Unassigned rows, grouped by the name they were uploaded under. One card per
 * name, not per row: a name is mapped once and every row bearing it follows.
 */
function unassignedGroups() {
  /*
   * The server owns clustering: it has the normaliser, the alias table and the
   * scorer, and duplicating any of those in the browser is how the two ends
   * start disagreeing about who somebody is. Here we only attach the rows.
   */
  var clusters = (S.data.unassignedClusters || []).map(function (c) {
    return {
      aliasKey: c.aliasKey, label: c.display_raw, spellings: c.spellings || [],
      reason: c.reason || '', suggestions: c.suggestions || [],
      ambiguous: !!c.ambiguous, warnings: c.warnings || [],
      rows: [], gross: c.total_amount || 0, rowCount: c.row_count || 0
    };
  });
  var bySpelling = {};
  clusters.forEach(function (c) {
    c.spellings.forEach(function (sp) { bySpelling[sp] = c; });
  });

  (S.data.txns || []).forEach(function (t) {
    if (t.vrmEmpCode || t.excluded) return;
    var c = bySpelling[String(t.vrm || '')];
    if (c) c.rows.push(t);
  });

  return clusters.filter(function (c) { return c.rowCount; });
}

function unassignedCount() {
  if (!S.data || !S.data.txns) return 0;
  return S.data.txns.filter(function (t) { return !t.vrmEmpCode && !t.excluded; }).length;
}

/** Unassigned gross as a share of firm gross — what drives the banner. */
function unassignedShare() {
  if (!S.data || !S.data.txns) return { gross: 0, firm: 0, pct: 0 };
  var un = metrics(S.data.txns.filter(function (t) { return !t.vrmEmpCode; }));
  var all = metrics(S.data.txns);
  return { gross: un.gross, firm: all.gross,
           pct: all.gross ? (un.gross / all.gross) * 100 : 0 };
}

/*
 * Shown above every page while a material slice of the book has no owner. VRM-wise
 * figures are genuinely incomplete until it clears, and a number nobody has
 * flagged as provisional is a number somebody will quote in a meeting.
 */
function provisionalBanner() {
  if (!isAdmin()) return '';
  var sh = unassignedShare();
  if (sh.pct <= 5) return '';
  return '<div class="panel" style="border-left:3px solid var(--warn);margin-bottom:18px">' +
    '<div style="padding:13px 18px;font-size:13.5px;color:var(--ink2)">' +
    '<b>Provisional</b> — ' + rupee(sh.gross) + ' (' + sh.pct.toFixed(1) + '%) is not yet ' +
    'attributed to a VRM, so VRM-wise figures are incomplete. ' +
    '<a href="#" data-act="gotounassigned" style="color:var(--p);font-weight:600">' +
    'Clear the Unassigned queue</a>.</div></div>';
}

function bandLabel(b) {
  return b === 'VERY_LIKELY' ? 'Very likely' : b === 'POSSIBLE' ? 'Possible' : 'Weak';
}
function bandColour(b) {
  return b === 'VERY_LIKELY' ? 'var(--ok)' : b === 'POSSIBLE' ? 'var(--warn)' : 'var(--ink3)';
}

/*
 * Post-render hooks. This is a QUEUE, not a single slot: one view can register
 * several (the analytics page draws a trend chart AND a league chart), and a
 * single slot would silently drop all but the last.
 */
function after(fn) {
  (window._afterQ = window._afterQ || []).push(fn);
  setTimeout(flushAfter_, 0);
}
function flushAfter_() {
  var q = window._afterQ || [];
  window._afterQ = [];
  q.forEach(function (f) { try { f(); } catch (e) {} });
}

function pageHead(title, sub, right) {
  return '<div class="phead"><div><h2>' + esc(title) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' +
         '<div class="tools">' + (right || '') + '</div></div>';
}
function searchBox(key, ph) {
  return '<div class="search">' + IC.search +
    '<input class="inp" type="search" data-q="' + key + '" placeholder="' + esc(ph) + '" value="' + esc(S.q[key] || '') + '">' +
    '</div>';
}
/* Two-click guard: first click arms, second click acts. */
function guard(key, armedHtml, idleHtml) {
  return S.confirm === key
    ? '<span class="conf">' + armedHtml +
      '<button class="btn xs gh" data-act="disarm">Cancel</button></span>'
    : idleHtml.replace('data-act="', 'data-arm="' + key + '" data-act="');
}

/* The `loading` flags stop a re-render (e.g. typing in the search box while the
   fetch is still in flight) from firing the same call over and over. */
function loadCreds() {
  if (S.loadingCreds) return;
  S.loadingCreds = true;
  api('getVrmCredentials', S.session.token).then(function (d) {
    S.loadingCreds = false; S.creds = d.vrms || []; render();
  }).catch(function (e) { S.loadingCreds = false; fail(e); });
}

}

function auditRows() {

    return true;

/* ============================== ANALYTICS ================================= *
 * Revenue analysis: trend over time at day / month / year granularity, growth
 * against both the previous period (DoD / MoM / YoY) and the same period a year
 * earlier, plus a per-VRM performance league table for the admin.
 * ========================================================================== */

S.an = { from: '', to: '', vrm: '', metric: 'net', gran: 'month' };

var GRAN = {
  day:   { key: function (d) { return d; },              label: function (k) { return dmy(k); },
           name: 'Daily',   delta: 'DoD' },
  month: { key: function (d) { return d.slice(0, 7); },  label: function (k) { return monLabel(k); },
           name: 'Monthly', delta: 'MoM' },
  year:  { key: function (d) { return d.slice(0, 4); },  label: function (k) { return k; },
           name: 'Yearly',  delta: 'YoY' }
};

var METRICS = {
  net:        { label: 'Net Sales',   pick: function (r) { return r.net; } },
  gross:      { label: 'Gross Sales', pick: function (r) { return r.gross; } },
  redemption: { label: 'Redemption',  pick: function (r) { return r.redemption; } },
  sip:        { label: 'SIP',         pick: function (r) { return r.sip; } },
  lumpsum:    { label: 'Lumpsum',     pick: function (r) { return r.lumpsum; } }
};

/** Transactions passing the analytics filters (date range + VRM). */
function anRows() {
  var f = S.an;
  return S.data.txns.filter(function (t) {
    if (!t.date) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.vrm && t.vrmEmpCode.toUpperCase() !== f.vrm.toUpperCase()) return false;
    return true;
  });
}

/** Bucket transactions into periods at the chosen granularity. */
function series(rows, gran) {
  var g = GRAN[gran] || GRAN.month, m = {};
  rows.forEach(function (t) {
    var k = g.key(t.date);
    if (!m[k]) m[k] = [];
    m[k].push(t);
  });
  return Object.keys(m).sort().map(function (k) {
    var mx = metrics(m[k]);
    mx.key = k;
    mx.n = m[k].length;
    mx.clientCount = clientCount(m[k]);
    return mx;
  });
}

/** The key one period earlier — a day back, a month back, or a year back. */
function prevKey(key, gran) {
  if (gran === 'year') return String(num(key) - 1);
  if (gran === 'month') {
    var y = num(key.slice(0, 4)), mo = num(key.slice(5, 7)) - 1;
    if (mo < 1) { mo = 12; y--; }
    return y + '-' + ('0' + mo).slice(-2);
  }
  var d = new Date(key + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return toIso(d);
}

/** The key one YEAR earlier, for a like-for-like comparison. */
function yoyKey(key, gran) {
  if (gran === 'year') return String(num(key) - 1);
  if (gran === 'month') return (num(key.slice(0, 4)) - 1) + key.slice(4);
  return (num(key.slice(0, 4)) - 1) + key.slice(4);
}

function pct(now, before) {
  if (!before) return now ? null : 0;      /* null = no baseline to compare against */
  return ((now - before) / Math.abs(before)) * 100;
}

function deltaCell(p) {
  if (p === null || p === undefined) return '<span class="muted">—</span>';
  var up = p >= 0;
  var arrow = up
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>'
    : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg>';
  return '<span class="pill ' + (up ? 'ok' : 'lock') + '">' + arrow + ' ' +
         (up ? '+' : '') + p.toFixed(1) + '%</span>';
}

function viewAnalytics() {
  var f = S.an;
  var g = GRAN[f.gran] || GRAN.month;
  var met = METRICS[f.metric] || METRICS.gross;
  var rows = anRows();
  var ser = series(rows, f.gran);
  var byKey = {};
  ser.forEach(function (r) { byKey[r.key] = r; });

  /* Headline: latest period vs the one before, and vs the same period last year. */
  var last = ser[ser.length - 1] || null;
  var prev = last ? byKey[prevKey(last.key, f.gran)] : null;
  var yoy = last ? byKey[yoyKey(last.key, f.gran)] : null;
  var rangeM = metrics(rows);
  var totTxns = rows.length, cl = {};
  rows.forEach(function (t) { if (t.clientCode) cl[t.clientCode.toUpperCase()] = 1; });

  var vrmOpts = (S.data.vrms || []).map(function (v) {
    return '<option value="' + esc(v.empCode) + '"' + (f.vrm === v.empCode ? ' selected' : '') + '>' +
           esc(v.name) + ' (' + esc(v.empCode) + ')</option>';
  }).join('');

  /* Chart of the last 24 periods. */
  var show = ser.slice(-24);
  after(function () {
    drawChart('cAn', show.map(function (r) { return g.label(r.key); }),
      show.map(function (r) { return r.gross; }), show.map(function (r) { return r.redemption; }),
      ['Gross Sales', 'Redemption']);
  });

  var head =
    pageHead('Revenue analysis',
      met.label + ' · ' + g.name.toLowerCase() + ' · ' + rows.length + ' transactions',
      expBtns('analytics'));

  var filters =
    '<div class="panel"><div class="ptop"><div><h3>Filters</h3></div>' +
    '<div class="tools"><button class="btn sm" data-act="anreset">Reset</button></div></div>' +
    '<div style="padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">' +
      '<div><label class="lbl">View by</label><select class="inp" data-an="gran">' +
        Object.keys(GRAN).map(function (k) {
          return '<option value="' + k + '"' + (f.gran === k ? ' selected' : '') + '>' + GRAN[k].name + '</option>';
        }).join('') + '</select></div>' +
      '<div><label class="lbl">Metric</label><select class="inp" data-an="metric">' +
        Object.keys(METRICS).map(function (k) {
          return '<option value="' + k + '"' + (f.metric === k ? ' selected' : '') + '>' + METRICS[k].label + '</option>';
        }).join('') + '</select></div>' +
      (isAdmin()
        ? '<div style="min-width:200px"><label class="lbl">VRM</label><select class="inp" data-an="vrm">' +
          '<option value="">All VRMs</option>' + vrmOpts + '</select></div>'
        : '') +
      '<div><label class="lbl">From</label><input class="inp" type="date" data-an="from" value="' + esc(f.from) + '"></div>' +
      '<div><label class="lbl">To</label><input class="inp" type="date" data-an="to" value="' + esc(f.to) + '"></div>' +
    '</div></div>';

  var cards = [
    { t: met.label + ' — ' + (last ? g.label(last.key) : '—'), v: last ? met.pick(last) : 0,
      s: g.delta + ' vs ' + (prev ? g.label(prev.key) : 'no prior period'),
      d: last && prev ? pct(met.pick(last), met.pick(prev)) : null, ic: IC.rupee },
    { t: 'Same period last year', v: yoy ? met.pick(yoy) : 0,
      s: yoy ? 'YoY vs ' + g.label(yoy.key) : 'no data a year earlier',
      d: last && yoy ? pct(met.pick(last), met.pick(yoy)) : null, ic: IC.cal },
    { t: 'Total in range', v: met.pick(rangeM),
      s: totTxns + ' transactions', d: null, ic: IC.chart },
    { t: 'Average per ' + f.gran, v: ser.length ? met.pick(rangeM) / ser.length : 0,
      s: 'across ' + ser.length + ' ' + f.gran + '(s)', d: null, ic: IC.repeat }
  ];

  var kpiHtml = '<div class="kpis">' + cards.map(function (c, i) {
    return '<div class="kpi' + (i % 2 ? ' g2' : '') + '">' +
      '<div class="kt"><span class="ki">' + c.ic + '</span>' + esc(c.t) + '</div>' +
      '<div class="kv" data-count="' + num(c.v) + '" data-plain="0">' + rupee(0) + '</div>' +
      '<div class="ks">' + (c.d !== null ? deltaCell(c.d) + ' ' : '') + esc(c.s) + '</div></div>';
  }).join('') + '</div>';

  var chart = ser.length
    ? '<div class="panel"><div class="ptop"><div><h3>' + esc(g.name) + ' trend</h3></div></div>' +
      '<div class="chartbox" id="cAn_box"><canvas id="cAn"></canvas></div>' +
      '<div class="legend"><i style="background:var(--p)"></i>Gross Sales' +
      '<i style="background:var(--dan);margin-left:16px"></i>Redemption</div></div>'
    : '<div class="panel">' + emptyState('Nothing in this range', 'Widen the dates or clear the filters.') + '</div>';

  /* Period-by-period table, newest first, with both growth columns. */
  var table =
    '<div class="panel"><div class="ptop"><div><h3>' + esc(g.name) + ' breakdown</h3></div></div>' +
    (ser.length
      ? '<div class="twrap"><table><thead><tr><th>Period</th>' +
        '<th class="num">SIP</th><th class="num">Lumpsum</th><th class="num">Gross</th>' +
        '<th class="num">Redemption</th><th class="num">Net Sales</th>' +
        '<th class="num">Txns</th><th class="num">Clients</th>' +
        '<th class="num">' + g.delta + '</th><th class="num">YoY</th></tr></thead><tbody>' +
        ser.slice().reverse().map(function (r) {
          var p = byKey[prevKey(r.key, f.gran)], y = byKey[yoyKey(r.key, f.gran)];
          return '<tr><td><b>' + esc(g.label(r.key)) + '</b></td>' +
            '<td class="num">' + rupee(r.sip) + '</td><td class="num">' + rupee(r.lumpsum) + '</td>' +
            '<td class="num tot">' + rupee(r.gross) + '</td>' +
            '<td class="num" style="color:var(--dan)">' + (r.redemption ? '-' + rupee(r.redemption) : rupee(0)) + '</td>' +
            '<td class="num tot" style="color:var(--a)">' + rupee(r.net) + '</td>' +
            '<td class="num">' + r.n + '</td><td class="num">' + r.clientCount + '</td>' +
            '<td class="num">' + deltaCell(p ? pct(met.pick(r), met.pick(p)) : null) + '</td>' +
            '<td class="num">' + deltaCell(y ? pct(met.pick(r), met.pick(y)) : null) + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><td>Total</td><td class="num">' + rupee(rangeM.sip) + '</td>' +
        '<td class="num">' + rupee(rangeM.lumpsum) + '</td><td class="num">' + rupee(rangeM.gross) + '</td>' +
        '<td class="num" style="color:var(--dan)">-' + rupee(rangeM.redemption) + '</td>' +
        '<td class="num" style="color:var(--a)">' + rupee(rangeM.net) + '</td>' +
        '<td class="num">' + totTxns + '</td><td class="num">' + Object.keys(cl).length + '</td>' +
        '<td colspan="2"></td></tr></tfoot></table></div>'
      : emptyState('No periods to show', 'Adjust the filters above.')) +
    '</div>';

  return head + filters + kpiHtml + chart + table + (isAdmin() ? leagueTable(rows, met, f) : '');
}

/** Admin: who actually brought in the business, and which way they are trending. */
function leagueTable(rows, met, f) {
  var per = {};
  (S.data.vrms || []).forEach(function (v) {
    per[v.empCode.toUpperCase()] = { empCode: v.empCode, name: v.name, rows: [], n: 0, clients: {}, cur: 0, prv: 0 };
  });

  /* Split the filtered range in half so "trend" compares like with like. */
  var dates = rows.map(function (t) { return t.date; }).sort();
  var mid = dates.length ? dates[Math.floor(dates.length / 2)] : '';

  rows.forEach(function (t) {
    var k = (t.vrmEmpCode || '-').toUpperCase();
    if (!per[k]) per[k] = { empCode: t.vrmEmpCode || '-', name: t.vrmEmpCode ? vrmNameOf(t) : 'Unassigned',
                            rows: [], n: 0, clients: {}, cur: 0, prv: 0 };
    var r = per[k];
    r.rows.push(t); r.n++;
    if (t.clientCode) r.clients[t.clientCode.toUpperCase()] = 1;
    var one = metrics([t]);
    var val = met.pick(one);
    if (t.date >= mid) r.cur += val; else r.prv += val;
  });

  var list = Object.keys(per).map(function (k) {
    var r = per[k];
    var mx = metrics(r.rows || []);
    r.sip = mx.sip; r.lumpsum = mx.lumpsum; r.redemption = mx.redemption;
    r.gross = mx.gross; r.net = mx.net;
    r.value = met.pick(r);
    r.clientCount = Object.keys(r.clients).length;
    r.trend = pct(r.cur, r.prv);
    return r;
  }).filter(function (r) { return r.n > 0; })
    .sort(function (a, b) { return b.value - a.value; });

  var total = list.reduce(function (a, r) { return a + r.value; }, 0);
  var best = list.length ? list[0].value : 0;

  after(function () {
    drawChart('cLeague', list.slice(0, 12).map(function (r) { return r.empCode; }),
      list.slice(0, 12).map(function (r) { return r.gross; }),
      list.slice(0, 12).map(function (r) { return r.redemption; }),
      ['Gross Sales', 'Redemption']);
  });

  return '<div class="panel"><div class="ptop"><div><h3>VRM performance</h3></div></div>' +
    (list.length
      ? '<div class="chartbox" id="cLeague_box"><canvas id="cLeague"></canvas></div>' +
        '<div class="legend"><i style="background:var(--p)"></i>Gross Sales' +
        '<i style="background:var(--dan);margin-left:16px"></i>Redemption</div>' +
        '<div class="twrap"><table><thead><tr><th>#</th><th>VRM</th>' +
        '<th class="num">' + esc(met.label) + '</th><th>Share</th>' +
        '<th class="num">Clients</th><th class="num">Txns</th>' +
        '<th class="num">Avg / txn</th><th class="num">Trend</th></tr></thead><tbody>' +
        list.map(function (r, i) {
          var share = total ? (r.value / total * 100) : 0;
          var barW = best ? Math.max(3, r.value / best * 100) : 0;
          return '<tr><td class="muted">' + (i + 1) + '</td>' +
            '<td><b>' + esc(r.name) + '</b><div class="mono muted" style="font-size:11.5px">' + esc(r.empCode) + '</div></td>' +
            '<td class="num tot">' + rupee(r.value) + '</td>' +
            '<td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px">' +
              '<div style="flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden">' +
                '<div style="width:' + barW.toFixed(1) + '%;height:100%;background:var(--grad)"></div></div>' +
              '<span class="mono" style="font-size:11.5px">' + share.toFixed(1) + '%</span></div></td>' +
            '<td class="num">' + r.clientCount + '</td><td class="num">' + r.n + '</td>' +
            '<td class="num">' + rupee(r.n ? r.value / r.n : 0) + '</td>' +
            '<td class="num">' + deltaCell(r.trend) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : emptyState('No VRM activity in this range', 'Adjust the filters above.')) +
    '</div>';
}

/* ------------------------------ ADMIN: Restore ---------------------------- *
 * Deleted transactions are flagged, not erased, so a mistaken deletion is
 * recoverable. This is that bin.
 * ========================================================================== */
function loadDeleted() {
  if (S.loadingDeleted) return;
  S.loadingDeleted = true;
  api('getDeletedTxns', S.session.token).then(function (d) {
    S.loadingDeleted = false; S.deleted = d.txns || []; render();
  }).catch(function (e) { S.loadingDeleted = false; fail(e); });
}

function viewRestore() {
  if (!S.deleted) { after(loadDeleted); return loadingPanel('Restore', 'Reading deleted transactions…'); }
  var q = (S.q.restore || '').toLowerCase();
  var rows = S.deleted.filter(function (t) {
    return !q || (t.clientCode + ' ' + t.clientName + ' ' + t.scheme + ' ' +
                  t.vrmEmpCode + ' ' + (t.batchId || '') + ' ' + (t.deletedBy || ''))
                 .toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return (b.deletedAt || '').localeCompare(a.deletedAt || ''); });

  /* Group by batch so a rolled-back upload can be put back in one go. */
  var batches = {};
  rows.forEach(function (t) {
    var b = t.batchId || '(no batch)';
    batches[b] = (batches[b] || 0) + 1;
  });
  var batchKeys = Object.keys(batches).filter(function (b) { return b !== '(no batch)'; });

  var m = metrics(rows);

  return pageHead('Restore deleted transactions',
      S.deleted.length + ' in the bin' + (q ? ' · ' + rows.length + ' matching' : ''),
      (S.deleted.length
        ? guard('restoreall',
            '<button class="btn xs acc" data-act="dorestoreall">Confirm — restore all ' + S.deleted.length + '</button>',
            '<button class="btn sm acc" data-act="arm">Restore all</button>')
        : '')) +
    (S.deleted.length
      ? '<div class="panel" style="border-left:3px solid var(--warn)"><div style="padding:14px 18px;' +
        'font-size:13.5px;color:var(--ink2)">These rows are excluded from every figure while they sit ' +
        'here. Restoring one puts it straight back into the totals.</div></div>'
      : '') +
    (batchKeys.length
      ? '<div class="panel"><div class="ptop"><div><h3>Restore a whole upload</h3></div></div>' +
        '<div style="padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap">' +
        batchKeys.map(function (b) {
          return '<div class="row" style="gap:8px;padding:8px 12px;border:1px solid var(--line);' +
            'border-radius:var(--r2);background:var(--surf2)">' +
            '<span class="mono">' + esc(b) + '</span>' +
            '<span class="muted" style="font-size:12px">' + batches[b] + ' row(s)</span>' +
            '<button class="btn xs acc" data-act="restorebatch" data-batch="' + esc(b) + '">Restore</button>' +
            '</div>';
        }).join('') + '</div></div>'
      : '') +
    '<div class="panel"><div class="ptop"><div><h3>Deleted transactions</h3></div>' +
