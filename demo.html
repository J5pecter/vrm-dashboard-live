/* ============================== ANALYTICS ================================= *
 * Revenue analysis: trend over time at day / month / year granularity, growth
 * against both the previous period (DoD / MoM / YoY) and the same period a year
 * earlier, plus a per-VRM performance league table for the admin.
 * ========================================================================== */

S.an = { from: '', to: '', vrm: '', metric: 'net', gran: 'month' };

var GRAN = {
  day:   { key: function (d) { return d; },              label: function (k) { return dmy(k); },
           name: 'Daily',   delta: 'DoD' },
  month: { key: function (d) { return d.slice(0, 7); },  label: function (k) { return monLabel(k); },
           name: 'Monthly', delta: 'MoM' },
  year:  { key: function (d) { return d.slice(0, 4); },  label: function (k) { return k; },
           name: 'Yearly',  delta: 'YoY' }
};

var METRICS = {
  net:        { label: 'Net Sales',   pick: function (r) { return r.net; } },
  gross:      { label: 'Gross Sales', pick: function (r) { return r.gross; } },
  redemption: { label: 'Redemption',  pick: function (r) { return r.redemption; } },
  sip:        { label: 'SIP',         pick: function (r) { return r.sip; } },
  lumpsum:    { label: 'Lumpsum',     pick: function (r) { return r.lumpsum; } }
};

/** Transactions passing the analytics filters (date range + VRM). */
function anRows() {
  var f = S.an;
  return S.data.txns.filter(function (t) {
    if (!t.date) return false;
    if (f.from && t.date < f.from) return false;
    if (f.to && t.date > f.to) return false;
    if (f.vrm && t.vrmEmpCode.toUpperCase() !== f.vrm.toUpperCase()) return false;
    return true;
  });
}

/** Bucket transactions into periods at the chosen granularity. */
function series(rows, gran) {
  var g = GRAN[gran] || GRAN.month, m = {};
  rows.forEach(function (t) {
    var k = g.key(t.date);
    if (!m[k]) m[k] = [];
    m[k].push(t);
  });
  return Object.keys(m).sort().map(function (k) {
    var mx = metrics(m[k]);
    mx.key = k;
    mx.n = m[k].length;
    mx.clientCount = clientCount(m[k]);
    return mx;
  });
}

/** The key one period earlier — a day back, a month back, or a year back. */
function prevKey(key, gran) {
  if (gran === 'year') return String(num(key) - 1);
  if (gran === 'month') {
    var y = num(key.slice(0, 4)), mo = num(key.slice(5, 7)) - 1;
    if (mo < 1) { mo = 12; y--; }
    return y + '-' + ('0' + mo).slice(-2);
  }
  var d = new Date(key + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  return toIso(d);
}

/** The key one YEAR earlier, for a like-for-like comparison. */
function yoyKey(key, gran) {
  if (gran === 'year') return String(num(key) - 1);
  if (gran === 'month') return (num(key.slice(0, 4)) - 1) + key.slice(4);
  return (num(key.slice(0, 4)) - 1) + key.slice(4);
}

function pct(now, before) {
  if (!before) return now ? null : 0;      /* null = no baseline to compare against */
  return ((now - before) / Math.abs(before)) * 100;
}

function deltaCell(p) {
  if (p === null || p === undefined) return '<span class="muted">—</span>';
  var up = p >= 0;
  var arrow = up
    ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>'
    : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg>';
  return '<span class="pill ' + (up ? 'ok' : 'lock') + '">' + arrow + ' ' +
         (up ? '+' : '') + p.toFixed(1) + '%</span>';
}

function viewAnalytics() {
  var f = S.an;
  var g = GRAN[f.gran] || GRAN.month;
  var met = METRICS[f.metric] || METRICS.gross;
  var rows = anRows();
  var ser = series(rows, f.gran);
  var byKey = {};
  ser.forEach(function (r) { byKey[r.key] = r; });

  /* Headline: latest period vs the one before, and vs the same period last year. */
  var last = ser[ser.length - 1] || null;
  var prev = last ? byKey[prevKey(last.key, f.gran)] : null;
  var yoy = last ? byKey[yoyKey(last.key, f.gran)] : null;
  var rangeM = metrics(rows);
  var totTxns = rows.length, cl = {};
  rows.forEach(function (t) { if (t.clientCode) cl[t.clientCode.toUpperCase()] = 1; });

  var vrmOpts = (S.data.vrms || []).map(function (v) {
    return '<option value="' + esc(v.empCode) + '"' + (f.vrm === v.empCode ? ' selected' : '') + '>' +
           esc(v.name) + ' (' + esc(v.empCode) + ')</option>';
  }).join('');

  /* Chart of the last 24 periods. */
  var show = ser.slice(-24);
  after(function () {
    drawChart('cAn', show.map(function (r) { return g.label(r.key); }),
      show.map(function (r) { return r.gross; }), show.map(function (r) { return r.redemption; }),
      ['Gross Sales', 'Redemption']);
  });

  var head =
    pageHead('Revenue analysis',
      met.label + ' · ' + g.name.toLowerCase() + ' · ' + rows.length + ' transactions',
      expBtns('analytics'));

  var filters =
    '<div class="panel"><div class="ptop"><div><h3>Filters</h3></div>' +
    '<div class="tools"><button class="btn sm" data-act="anreset">Reset</button></div></div>' +
    '<div style="padding:16px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">' +
      '<div><label class="lbl">View by</label><select class="inp" data-an="gran">' +
        Object.keys(GRAN).map(function (k) {
          return '<option value="' + k + '"' + (f.gran === k ? ' selected' : '') + '>' + GRAN[k].name + '</option>';
        }).join('') + '</select></div>' +
      '<div><label class="lbl">Metric</label><select class="inp" data-an="metric">' +
        Object.keys(METRICS).map(function (k) {
          return '<option value="' + k + '"' + (f.metric === k ? ' selected' : '') + '>' + METRICS[k].label + '</option>';
        }).join('') + '</select></div>' +
      (isAdmin()
        ? '<div style="min-width:200px"><label class="lbl">VRM</label><select class="inp" data-an="vrm">' +
          '<option value="">All VRMs</option>' + vrmOpts + '</select></div>'
        : '') +
      '<div><label class="lbl">From</label><input class="inp" type="date" data-an="from" value="' + esc(f.from) + '"></div>' +
      '<div><label class="lbl">To</label><input class="inp" type="date" data-an="to" value="' + esc(f.to) + '"></div>' +
    '</div></div>';

  var cards = [
    { t: met.label + ' — ' + (last ? g.label(last.key) : '—'), v: last ? met.pick(last) : 0,
      s: g.delta + ' vs ' + (prev ? g.label(prev.key) : 'no prior period'),
      d: last && prev ? pct(met.pick(last), met.pick(prev)) : null, ic: IC.rupee },
    { t: 'Same period last year', v: yoy ? met.pick(yoy) : 0,
      s: yoy ? 'YoY vs ' + g.label(yoy.key) : 'no data a year earlier',
      d: last && yoy ? pct(met.pick(last), met.pick(yoy)) : null, ic: IC.cal },
    { t: 'Total in range', v: met.pick(rangeM),
      s: totTxns + ' transactions', d: null, ic: IC.chart },
    { t: 'Average per ' + f.gran, v: ser.length ? met.pick(rangeM) / ser.length : 0,
      s: 'across ' + ser.length + ' ' + f.gran + '(s)', d: null, ic: IC.repeat }
  ];

  var kpiHtml = '<div class="kpis">' + cards.map(function (c, i) {
    return '<div class="kpi' + (i % 2 ? ' g2' : '') + '">' +
      '<div class="kt"><span class="ki">' + c.ic + '</span>' + esc(c.t) + '</div>' +
      '<div class="kv" data-count="' + num(c.v) + '" data-plain="0">' + rupee(0) + '</div>' +
      '<div class="ks">' + (c.d !== null ? deltaCell(c.d) + ' ' : '') + esc(c.s) + '</div></div>';
  }).join('') + '</div>';

  var chart = ser.length
    ? '<div class="panel"><div class="ptop"><div><h3>' + esc(g.name) + ' trend</h3></div></div>' +
      '<div class="chartbox" id="cAn_box"><canvas id="cAn"></canvas></div>' +
      '<div class="legend"><i style="background:var(--p)"></i>Gross Sales' +
      '<i style="background:var(--dan);margin-left:16px"></i>Redemption</div></div>'
    : '<div class="panel">' + emptyState('Nothing in this range', 'Widen the dates or clear the filters.') + '</div>';

  /* Period-by-period table, newest first, with both growth columns. */
  var table =
    '<div class="panel"><div class="ptop"><div><h3>' + esc(g.name) + ' breakdown</h3></div></div>' +
    (ser.length
      ? '<div class="twrap"><table><thead><tr><th>Period</th>' +
        '<th class="num">SIP</th><th class="num">Lumpsum</th><th class="num">Gross</th>' +
        '<th class="num">Redemption</th><th class="num">Net Sales</th>' +
        '<th class="num">Txns</th><th class="num">Clients</th>' +
        '<th class="num">' + g.delta + '</th><th class="num">YoY</th></tr></thead><tbody>' +
        ser.slice().reverse().map(function (r) {
          var p = byKey[prevKey(r.key, f.gran)], y = byKey[yoyKey(r.key, f.gran)];
          return '<tr><td><b>' + esc(g.label(r.key)) + '</b></td>' +
            '<td class="num">' + rupee(r.sip) + '</td><td class="num">' + rupee(r.lumpsum) + '</td>' +
            '<td class="num tot">' + rupee(r.gross) + '</td>' +
            '<td class="num" style="color:var(--dan)">' + (r.redemption ? '-' + rupee(r.redemption) : rupee(0)) + '</td>' +
            '<td class="num tot" style="color:var(--a)">' + rupee(r.net) + '</td>' +
            '<td class="num">' + r.n + '</td><td class="num">' + r.clientCount + '</td>' +
            '<td class="num">' + deltaCell(p ? pct(met.pick(r), met.pick(p)) : null) + '</td>' +
            '<td class="num">' + deltaCell(y ? pct(met.pick(r), met.pick(y)) : null) + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><td>Total</td><td class="num">' + rupee(rangeM.sip) + '</td>' +
        '<td class="num">' + rupee(rangeM.lumpsum) + '</td><td class="num">' + rupee(rangeM.gross) + '</td>' +
        '<td class="num" style="color:var(--dan)">-' + rupee(rangeM.redemption) + '</td>' +
        '<td class="num" style="color:var(--a)">' + rupee(rangeM.net) + '</td>' +
        '<td class="num">' + totTxns + '</td><td class="num">' + Object.keys(cl).length + '</td>' +
        '<td colspan="2"></td></tr></tfoot></table></div>'
      : emptyState('No periods to show', 'Adjust the filters above.')) +
    '</div>';

  return head + filters + kpiHtml + chart + table + (isAdmin() ? leagueTable(rows, met, f) : '');
}

/** Admin: who actually brought in the business, and which way they are trending. */
function leagueTable(rows, met, f) {
  var per = {};
  (S.data.vrms || []).forEach(function (v) {
    per[v.empCode.toUpperCase()] = { empCode: v.empCode, name: v.name, rows: [], n: 0, clients: {}, cur: 0, prv: 0 };
  });

  /* Split the filtered range in half so "trend" compares like with like. */
  var dates = rows.map(function (t) { return t.date; }).sort();
  var mid = dates.length ? dates[Math.floor(dates.length / 2)] : '';

  rows.forEach(function (t) {
    var k = (t.vrmEmpCode || '-').toUpperCase();
    if (!per[k]) per[k] = { empCode: t.vrmEmpCode || '-', name: t.vrmEmpCode ? vrmNameOf(t) : 'Unassigned',
                            rows: [], n: 0, clients: {}, cur: 0, prv: 0 };
    var r = per[k];
    r.rows.push(t); r.n++;
    if (t.clientCode) r.clients[t.clientCode.toUpperCase()] = 1;
    var one = metrics([t]);
    var val = met.pick(one);
    if (t.date >= mid) r.cur += val; else r.prv += val;
  });

  var list = Object.keys(per).map(function (k) {
    var r = per[k];
    var mx = metrics(r.rows || []);
    r.sip = mx.sip; r.lumpsum = mx.lumpsum; r.redemption = mx.redemption;
    r.gross = mx.gross; r.net = mx.net;
    r.value = met.pick(r);
    r.clientCount = Object.keys(r.clients).length;
    r.trend = pct(r.cur, r.prv);
    return r;
  }).filter(function (r) { return r.n > 0; })
    .sort(function (a, b) { return b.value - a.value; });

  var total = list.reduce(function (a, r) { return a + r.value; }, 0);
  var best = list.length ? list[0].value : 0;

  after(function () {
    drawChart('cLeague', list.slice(0, 12).map(function (r) { return r.empCode; }),
      list.slice(0, 12).map(function (r) { return r.gross; }),
      list.slice(0, 12).map(function (r) { return r.redemption; }),
      ['Gross Sales', 'Redemption']);
  });

  return '<div class="panel"><div class="ptop"><div><h3>VRM performance</h3></div></div>' +
    (list.length
      ? '<div class="chartbox" id="cLeague_box"><canvas id="cLeague"></canvas></div>' +
        '<div class="legend"><i style="background:var(--p)"></i>Gross Sales' +
        '<i style="background:var(--dan);margin-left:16px"></i>Redemption</div>' +
        '<div class="twrap"><table><thead><tr><th>#</th><th>VRM</th>' +
        '<th class="num">' + esc(met.label) + '</th><th>Share</th>' +
        '<th class="num">Clients</th><th class="num">Txns</th>' +
        '<th class="num">Avg / txn</th><th class="num">Trend</th></tr></thead><tbody>' +
        list.map(function (r, i) {
          var share = total ? (r.value / total * 100) : 0;
          var barW = best ? Math.max(3, r.value / best * 100) : 0;
          return '<tr><td class="muted">' + (i + 1) + '</td>' +
            '<td><b>' + esc(r.name) + '</b><div class="mono muted" style="font-size:11.5px">' + esc(r.empCode) + '</div></td>' +
            '<td class="num tot">' + rupee(r.value) + '</td>' +
            '<td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px">' +
              '<div style="flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden">' +
                '<div style="width:' + barW.toFixed(1) + '%;height:100%;background:var(--grad)"></div></div>' +
              '<span class="mono" style="font-size:11.5px">' + share.toFixed(1) + '%</span></div></td>' +
            '<td class="num">' + r.clientCount + '</td><td class="num">' + r.n + '</td>' +
            '<td class="num">' + rupee(r.n ? r.value / r.n : 0) + '</td>' +
            '<td class="num">' + deltaCell(r.trend) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : emptyState('No VRM activity in this range', 'Adjust the filters above.')) +
    '</div>';
}

/* ------------------------------ ADMIN: Restore ---------------------------- *
 * Deleted transactions are flagged, not erased, so a mistaken deletion is
 * recoverable. This is that bin.
 * ========================================================================== */
function loadDeleted() {
  if (S.loadingDeleted) return;
  S.loadingDeleted = true;
  api('getDeletedTxns', S.session.token).then(function (d) {
    S.loadingDeleted = false; S.deleted = d.txns || []; render();
  }).catch(function (e) { S.loadingDeleted = false; fail(e); });
}

function viewRestore() {
  if (!S.deleted) { after(loadDeleted); return loadingPanel('Restore', 'Reading deleted transactions…'); }
  var q = (S.q.restore || '').toLowerCase();
  var rows = S.deleted.filter(function (t) {
    return !q || (t.clientCode + ' ' + t.clientName + ' ' + t.scheme + ' ' +
                  t.vrmEmpCode + ' ' + (t.batchId || '') + ' ' + (t.deletedBy || ''))
                 .toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return (b.deletedAt || '').localeCompare(a.deletedAt || ''); });

  /* Group by batch so a rolled-back upload can be put back in one go. */
  var batches = {};
  rows.forEach(function (t) {
    var b = t.batchId || '(no batch)';
    batches[b] = (batches[b] || 0) + 1;
  });
  var batchKeys = Object.keys(batches).filter(function (b) { return b !== '(no batch)'; });

  var m = metrics(rows);

  return pageHead('Restore deleted transactions',
      S.deleted.length + ' in the bin' + (q ? ' · ' + rows.length + ' matching' : ''),
      (S.deleted.length
        ? guard('restoreall',
            '<button class="btn xs acc" data-act="dorestoreall">Confirm — restore all ' + S.deleted.length + '</button>',
            '<button class="btn sm acc" data-act="arm">Restore all</button>')
        : '')) +
    (S.deleted.length
      ? '<div class="panel" style="border-left:3px solid var(--warn)"><div style="padding:14px 18px;' +
        'font-size:13.5px;color:var(--ink2)">These rows are excluded from every figure while they sit ' +
        'here. Restoring one puts it straight back into the totals.</div></div>'
      : '') +
    (batchKeys.length
      ? '<div class="panel"><div class="ptop"><div><h3>Restore a whole upload</h3></div></div>' +
        '<div style="padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap">' +
        batchKeys.map(function (b) {
          return '<div class="row" style="gap:8px;padding:8px 12px;border:1px solid var(--line);' +
            'border-radius:var(--r2);background:var(--surf2)">' +
            '<span class="mono">' + esc(b) + '</span>' +
            '<span class="muted" style="font-size:12px">' + batches[b] + ' row(s)</span>' +
            '<button class="btn xs acc" data-act="restorebatch" data-batch="' + esc(b) + '">Restore</button>' +
            '</div>';
        }).join('') + '</div></div>'
      : '') +
    '<div class="panel"><div class="ptop"><div><h3>Deleted transactions</h3></div>' +
    '<div class="tools">' + searchBox('restore', 'Search client, scheme, batch…') + '</div></div>' +
    (rows.length
      ? '<div class="twrap"><table><thead><tr>' +
        '<th>Deleted</th><th>By</th><th>Txn Date</th><th>Client</th><th>Scheme</th>' +
        '<th>TXN Type</th><th class="num">Amount</th><th>Status</th><th>VRM</th><th>Batch</th><th></th>' +
        '</tr></thead><tbody>' +
        rows.map(function (t) {
          return '<tr><td class="mono" style="white-space:nowrap">' + esc(stamp(t.deletedAt)) + '</td>' +
            '<td class="mono">' + esc(t.deletedBy || '—') + '</td>' +
            '<td class="mono">' + esc(dmy(t.date)) + '</td>' +
            '<td class="mono">' + esc(t.clientCode) +
              '<div class="muted" style="font-size:11px">' + esc(t.clientName) + '</div></td>' +
            '<td><span class="cx" style="max-width:190px" title="' + esc(t.scheme) + '">' +
              esc(t.scheme || '—') + '</span></td>' +

        }).join('') +

      : emptyState(q ? 'Nothing matches' : 'The bin is empty',

    '</div>';
}

/*
 * Second pass: the same rows, plus a decision for every collision.
 * KEEP_BOTH stores the row alongside its twin; SKIP leaves it out.
 */
function commitImport(rows, fileName, decisions) {
  return api('addTxns', S.session.token, rows, 'IMPORT',
             { fileName: fileName, fileType: window._pendingType || '',
               decisions: decisions || {} })
    .then(function (d) {
      var r = d.result || {};
      if (r.rejected) { uploadErrorDialog(r, fileName); return; }
      closeModal();
      absorb(d);
      toast(num(r.inserted) + ' row(s) uploaded' +
        (num(r.blank) ? ', ' + r.blank + ' blank skipped' : '') +
        (num(r.keptBoth) ? ', ' + r.keptBoth + ' duplicate(s) kept' : '') +
        (num(r.skippedDuplicates) ? ', ' + r.skippedDuplicates + ' duplicate(s) skipped' : '') +
        (num(r.viaAlias) ? ', ' + r.viaAlias + ' matched a remembered name' : '') +
        (num(r.excluded) ? ', ' + r.excluded + ' excluded' : '') +
        (num(r.unassigned) ? '. ' + r.unassigned + ' need a VRM — see Unassigned' : '') +
        (r.batchId ? ' [' + r.batchId + ']' : ''));
      window._pendingImport = null;
      window._dupGroups = null;
    });
}

/* SheetJS is only needed for Excel import/export and the Excel template. */
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (window._xlsxLoading) return window._xlsxLoading;
  window._xlsxLoading = new Promise(function (res, rej) {
    var i = 0;
    (function next() {
      if (i >= SHEETJS_URLS.length) {
        return rej(new Error('Could not load the Excel library. Check your internet connection, or use CSV instead.'));
      }
      var s = document.createElement('script');
      s.src = SHEETJS_URLS[i++];
      s.onload = function () { window.XLSX ? res(window.XLSX) : next(); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
  return window._xlsxLoading;
}

function download(filename, blob) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
}

function csvCell(v) {
  var s = v === null || v === undefined ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function saveCsv(filename, headers, rows) {
  var body = [headers].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  download(filename + '.csv', new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8;' }));
  toast('Downloaded ' + filename + '.csv');
}
function saveXlsx(filename, sheetName, headers, rows) {
  return loadSheetJs().then(function (X) {
    var ws = X.utils.aoa_to_sheet([headers].concat(rows));
    ws['!cols'] = headers.map(function (h) { return { wch: Math.max(12, String(h).length + 4) }; });
    var wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, (sheetName || 'Sheet1').slice(0, 31));
    X.writeFile(wb, filename + '.xlsx');

}

/* Exports always reflect the current tab and its active search / filters. */
function exportSpec(what) {
  /* Every export carries the twelve source columns plus the derived business
     figures, so a spreadsheet opened offline reconciles with the dashboard. */
  var SRC = TPL_HEADERS.concat(['VRM Emp Code', 'Gross Sales', 'Redemption', 'Net Sales',
                                'Counted', 'Batch ID', 'Transaction ID']);

  function txnRow(t) {
    var counted = isCounted(t);
    var g = counted && isPurchase(t) ? num(t.amount) : 0;
    var rd = counted && t.txnType === TT.REDEMPTION ? num(t.amount) : 0;
    return [dmy(t.date), hhmm(t.time), t.clientCode, t.clientName, t.pan,
            vrmNameOf(t), t.rmName, t.scheme, TT_LABEL[t.txnType] || t.txnType, num(t.amount),
            TS_LABEL[t.status] || t.status, t.reason,
            t.vrmEmpCode, g, rd, g - rd, counted ? 'Yes' : 'No', t.batchId, t.id];
  }

  var rows;
  if (what === 'vrmtxns' || what === 'alltxns' || what === 'clientdetail') {
    var q = S.q[what === 'vrmtxns' ? 'data' : 'alltxns'] || '';
    var src = S.data.txns;
    if (what === 'clientdetail') {
      src = src.filter(function (t) {
        return String(t.clientCode).toUpperCase() === String(S.clientCode).toUpperCase();
      });
      q = '';
    } else if (what === 'alltxns') {
      src = src.filter(function (t) {
        if (S.fType && t.txnType !== S.fType) return false;
        if (S.fStatus && t.status !== S.fStatus) return false;
        if (S.fVrm && String(t.vrmEmpCode).toUpperCase() !== S.fVrm.toUpperCase()) return false;
        return true;
      });
    }
    rows = src.filter(function (t) { return matches(t, q); })
      .sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); })
      .map(txnRow);
    return {
      file: 'VRM-MF_' + (what === 'clientdetail' ? 'client-' + S.clientCode :
             (what === 'vrmtxns' ? S.session.empCode + '_transactions' : 'all-transactions')),
      sheet: 'Transactions', headers: SRC, rows: rows
    };
  }

  if (what === 'clients') {
    var cq = (S.q.clients || '').toLowerCase();
    rows = byClient(S.data.txns).filter(function (r) {
      return !cq || (r.clientCode + ' ' + r.clientName + ' ' + (r.pan || '')).toLowerCase().indexOf(cq) >= 0;
    }).map(function (r) {
      return [r.clientCode, r.clientName, r.pan, r.vrms.join(' / '), r.rms.join(' / '),
              r.sip, r.lumpsum, r.gross, r.redemption, r.net, r.n,

      file: 'VRM-MF_client-consolidated', sheet: 'Client Consolidated',
      headers: ['Client Code', 'Client Name', 'PAN No.', 'VRM', 'RM Name',
                'SIP Total', 'Lumpsum Total', 'Gross Sales', 'Redemption Total',
                'Net Sales', 'Transactions', 'First Transaction', 'Latest Transaction'],
      rows: rows
    };
  }

  if (what === 'vrmwise') {
    var vq = (S.q.vrmwise || '').toLowerCase();
    rows = byVrm(S.data.txns, S.data.vrms).filter(function (r) {
      return !vq || (r.empCode + ' ' + r.name).toLowerCase().indexOf(vq) >= 0;
    }).map(function (r) {
      return [r.empCode, r.name, r.rms.join(' / '), r.clientCount,
              r.sip, r.lumpsum, r.gross, r.redemption, r.net, r.n];
    });
    return {
      file: 'VRM-MF_vrm-wise-summary', sheet: 'VRM-wise',
      headers: ['VRM Emp Code', 'VRM Name', 'RM Name(s)', 'Clients', 'SIP', 'Lumpsum',
                'Gross Sales', 'Redemption', 'Net Sales', 'Transactions'],
      rows: rows
    };
  }

  if (what === 'scheme') {
    var sq = (S.q.scheme || '').toLowerCase();
    var scoped = S.data.txns.filter(function (t) {
      if (S.fType && t.txnType !== S.fType) return false;
      if (S.fStatus && t.status !== S.fStatus) return false;
      if (S.fVrm && String(t.vrmEmpCode).toUpperCase() !== S.fVrm.toUpperCase()) return false;
      return true;
    });
    rows = byScheme(scoped).filter(function (r) {
      return !sq || r.scheme.toLowerCase().indexOf(sq) >= 0;
    }).map(function (r) {
      return [r.scheme, r.sip, r.lumpsum, r.gross, r.redemption, r.net, r.clientCount, r.n];
    });
    return {
      file: 'VRM-MF_scheme-analysis', sheet: 'Scheme Analysis',
      headers: ['Scheme Name', 'SIP', 'Lumpsum', 'Gross Sales', 'Redemption',
                'Net Sales', 'Clients', 'Transactions'],
      rows: rows
    };

  if (what === 'analytics') {

/* --------------------------- header matching ----------------------------- */
/* Loose header matching: punctuation and case are ignored, and the aliases cover
   the variations these files arrive with. */
var HEADER_MAP = {
  date:       ['txndate', 'transactiondate', 'date', 'dateoftransaction', 'trxndate'],
  time:       ['txntime', 'transactiontime', 'time', 'trxntime'],
  clientCode: ['clientcode', 'code', 'clcode', 'clientid', 'clientno'],
  clientName: ['clientname', 'name', 'client', 'investorname'],
  pan:        ['panno', 'pan', 'pannumber', 'pancard', 'pannum'],
  vrm:        ['vrm', 'vrmname', 'vrmempname'],
  rmName:     ['rmname', 'rm', 'relationshipmanager', 'rmmanager'],
  scheme:     ['schemename', 'scheme', 'fundname', 'schemedescription'],
  txnType:    ['txntype', 'transactiontype', 'type', 'trxntype', 'transactioncategory'],
  amount:     ['amount', 'amt', 'transactionamount', 'txnamount', 'grossamount',
               'transamount', 'transactionamt'],
  status:     ['txnstatus', 'transactionstatus', 'status', 'trxnstatus'],
  reason:     ['reasonforrejection', 'rejectionreason', 'reason', 'remarks', 'remark'],
  folio:      ['folionumber', 'folio', 'foliono', 'foliono.']
};

/*
 * The redemption report is a different export with a different shape: no TXN Type
 * column at all, and a column headed "Status" that holds RED — the transaction
 * TYPE, not its status. Detected rather than assumed: if the status column's
 * values normalise to known transaction types instead of known statuses, that
 * column is the type, and the rows are treated as completed transactions.
 */
function detectTypeInStatusColumn(matrix, hi, idx) {
  if (idx.txnType !== undefined) return false;      /* a real TXN Type column exists */
  if (idx.status === undefined) return false;
  var asType = 0, asStatus = 0, seen = 0;
  for (var i = hi + 1; i < Math.min(matrix.length, hi + 60); i++) {
    var v = (matrix[i] || [])[idx.status];
    if (v === undefined || v === null || String(v).trim() === '') continue;
    seen++;
    if (normTxnTypeC(v)) asType++;
    else if (normTxnStatusC(v)) asStatus++;
  }
  return seen > 0 && asType > 0 && asType >= asStatus;
}

/* Client-side mirrors of the server's normalisers, for shape detection only. */
function keyC(v) { return String(v == null ? '' : v).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
var TYPE_ALIAS_C = {
  SIP: 'SIP', SIPPURCHASE: 'SIP', SYSTEMATICINVESTMENTPLAN: 'SIP',
  LUMPSUM: 'LUMPSUM', LUMPSOM: 'LUMPSUM', LUMP: 'LUMPSUM', PURCHASE: 'LUMPSUM',
  FRESHPURCHASE: 'LUMPSUM', ADDITIONALPURCHASE: 'LUMPSUM', ONETIME: 'LUMPSUM',
  REDEMPTION: 'REDEMPTION', REDEEM: 'REDEMPTION', REDMPTION: 'REDEMPTION',
  SELL: 'REDEMPTION', WITHDRAWAL: 'REDEMPTION', SWP: 'REDEMPTION',
  RED: 'REDEMPTION', REDM: 'REDEMPTION', REDEMP: 'REDEMPTION'
};
var STATUS_ALIAS_C = {
  COMPLETED: 'COMPLETED', COMPLETE: 'COMPLETED', SUCCESS: 'COMPLETED',
  ALLOTMENTDONE: 'COMPLETED', PROCESSED: 'COMPLETED', CONFIRMED: 'COMPLETED',
  INPROCESS: 'IN_PROCESS', PENDING: 'IN_PROCESS', UNDERPROCESS: 'IN_PROCESS',
  INPROGRESS: 'IN_PROCESS', SUBMITTED: 'IN_PROCESS',
  REJECTED: 'REJECTED', REJECT: 'REJECTED', FAILED: 'REJECTED',
  CANCELLED: 'REJECTED', CANCELED: 'REJECTED', REVERSED: 'REJECTED'
};
function normTxnTypeC(v) { return TYPE_ALIAS_C[keyC(v)] || ''; }
function normTxnStatusC(v) { return STATUS_ALIAS_C[keyC(v)] || ''; }
function normHead(h) { return String(h || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* True when a cell has been through Excel and come out as 4.40454E+11. */
function isSciNotation(v) {
  return /^-?\d(\.\d+)?[eE][+-]?\d+$/.test(String(v || '').trim());
}

function mapColumns(headerRow) {
  var idx = {};
  var norm = headerRow.map(normHead);
  Object.keys(HEADER_MAP).forEach(function (field) {
    for (var i = 0; i < HEADER_MAP[field].length; i++) {
      var pos = norm.indexOf(HEADER_MAP[field][i]);
      if (pos >= 0) { idx[field] = pos; return; }
    }
  });
  return idx;
}

function rowsFromMatrix(matrix) {
  /* Find the header row: the first row that maps a date AND an amount. Files
     often carry a title or blank rows above the real header. */
  var hi = -1, idx = null;
  for (var r = 0; r < Math.min(matrix.length, 15); r++) {
    var m = mapColumns(matrix[r] || []);
    if (m.date !== undefined && m.amount !== undefined) { hi = r; idx = m; break; }
  }
  if (hi < 0) {
    throw new Error('Could not find the expected columns. Download the template — the file needs ' +
                    'TxnDate, TXN Type and Amount at minimum.');
  }

  /* A redemption report carries the type in its "Status" column. */
  var typeFromStatus = detectTypeInStatusColumn(matrix, hi, idx);
  window.__typeFromStatus = typeFromStatus;

  var required = { date: 'TxnDate', clientCode: 'Client Code', amount: 'Amount' };
  if (!typeFromStatus) {
    required.txnType = 'TXN Type';
    required.status = 'Txn Status';
  }
  var missing = Object.keys(required).filter(function (k) { return idx[k] === undefined; })
                  .map(function (k) { return required[k]; });
  if (missing.length) {
    throw new Error('The file is missing these column(s): ' + missing.join(', ') +
                    '. Download the template to see the expected layout.');
  }

  /* Settle day-first vs month-first once, from every date in the file. */
  var rawDates = [];
  for (var d0 = hi + 1; d0 < matrix.length; d0++) {
    var rw = matrix[d0] || [];
    if (idx.date !== undefined) rawDates.push(rw[idx.date]);
  }
  var order = inferDateOrder(rawDates);
  if (order === 'MIXED') {
    throw new Error('This file mixes day-first and month-first dates (it contains both ' +
      'something like 17-08-2026 and something like 08-17-2026). Please make the date ' +
      'column consistent, then upload again.');
  }
  window.__dateOrder = order || 'DMY';

  var out = [], blank = 0;
  for (var i = hi + 1; i < matrix.length; i++) {
    var row = matrix[i] || [];
    var get = function (f) { return idx[f] === undefined ? '' : row[idx[f]]; };
    var rec = {
      __line: i + 1,                       /* the row number in their file */
      date: get('date'),
      time: get('time'),
      clientCode: String(get('clientCode') == null ? '' : get('clientCode')).trim(),
      clientName: String(get('clientName') == null ? '' : get('clientName')).trim(),
      pan: String(get('pan') == null ? '' : get('pan')).trim(),
      vrm: String(get('vrm') == null ? '' : get('vrm')).trim(),
      rmName: String(get('rmName') == null ? '' : get('rmName')).trim(),
      scheme: String(get('scheme') == null ? '' : get('scheme')).trim(),
      txnType: String((typeFromStatus ? get('status') : get('txnType')) == null
                      ? '' : (typeFromStatus ? get('status') : get('txnType'))).trim(),
      amount: num(String(get('amount')).replace(/[,\s₹]/g, '')),
      /* A redemption report has no status column of its own — these are settled
         transactions by the time they appear in it. */
      status: typeFromStatus ? 'Completed'
              : String(get('status') == null ? '' : get('status')).trim(),
      reason: String(get('reason') == null ? '' : get('reason')).trim(),
      folio: String(get('folio') == null ? '' : get('folio')).trim()
    };
    /* Normalise here so the preview shows exactly what will be stored. */
    rec.date = toIsoOrdered(rec.date, order) || '';

    var empty = !rec.clientCode && !rec.clientName && !rec.amount &&
                !rec.txnType && !String(rec.date || '').trim() && !rec.folio;
    if (empty) { blank++; continue; }
    out.push(rec);
  }
  return { rows: out, skipped: blank };
}

/* Minimal RFC-4180 CSV parser so CSV import/export works with no internet. */
/*
 * Which character separates the columns? Counted on the first few non-empty
 * lines, outside quotes, and the winner takes it. Tabs are common — the
 * redemption report is tab separated, and a .csv saved from a tab-delimited
 * source keeps its tabs — and semicolons turn up from European locales.
 */
function sniffDelimiter(text) {
  var lines = String(text).split(/\r?\n/).filter(function (l) { return l.trim(); }).slice(0, 5);
  if (!lines.length) return ',';
  var cands = [',', '\t', ';', '|'];
  var best = ',', bestScore = -1;
  cands.forEach(function (d) {
    var counts = lines.map(function (l) {
      var n = 0, q = false;
      for (var i = 0; i < l.length; i++) {
        if (l[i] === '"') q = !q;
        else if (!q && l[i] === d) n++;
      }
      return n;
    });
    var min = Math.min.apply(null, counts);
    /* A real delimiter appears the same number of times on every line, and more
       than once. Consistency matters more than raw frequency: a comma inside one
       scheme name must not out-vote the tab that actually splits the columns. */
    var consistent = counts.every(function (c) { return c === counts[0]; });
    var score = min * (consistent ? 10 : 1);
    if (min > 0 && score > bestScore) { bestScore = score; best = d; }
  });
  return best;
}

function parseCsv(text, delim) {
  var d = delim || sniffDelimiter(text);
  window.__csvDelim = d;
  var rows = [], row = [], cell = '', q = false;
  text = String(text).replace(/^﻿/, '');
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === d) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function handleFile(file) {
  /* Anything text-shaped goes through the delimiter sniffer; only real
     spreadsheets need SheetJS. */
  var isCsv = /\.(csv|tsv|txt|psv)$/i.test(file.name);
  var reader = new FileReader();
  reader.onerror = function () { toast('Could not read that file.', 'e'); };
  reader.onload = function (e) {
    try {
      if (isCsv) {
        finish(parseCsv(e.target.result));
      } else {
        loadSheetJs().then(function (X) {
          var wb = X.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
          var ws = wb.Sheets[wb.SheetNames[0]];
          finish(X.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }));
        }).catch(fail);
      }
    } catch (err) { fail(err); }
  };
  function finish(matrix) {
    try {
      var res = rowsFromMatrix(matrix);

      /*
       * The user told us which kind of file this is by which button they pressed.
       * Believe the file over the button, but say so — silently treating a
       * purchase export as a redemption report (or the reverse) is how a month
       * ends up with its signs inverted.
       */
      var want = window.__expectShape;
      var looksRedemption = !!window.__typeFromStatus ||
        res.rows.every(function (r) { return normTxnTypeC(r.txnType) === 'REDEMPTION'; });
      if (want === 'REDEMPTION' && !looksRedemption) {
        return modal('That does not look like a redemption report',
          'You pressed <b>Upload redemptions</b>, but this file reads as a normal ' +
          'purchase export.',
          '<div class="panel" style="border-left:3px solid var(--warn)"><div style="padding:14px 18px;' +
          'font-size:13.5px;color:var(--ink2)">The redemption report has a <b>Status</b> column ' +
          'holding <b>RED</b>, and a <b>Folio Number</b>. This file has neither.<br><br>' +
          'If it really is a purchase file, use <b>Upload purchases</b> instead. If it is meant ' +
          'to be a redemption report, download <b>Redemption template</b> to see the expected ' +
          'columns.</div></div>',
          '<button class="btn pri" data-act="close">Close</button>');
      }
      if (want === 'PURCHASE' && looksRedemption && res.rows.length) {
        return modal('That looks like a redemption report',
          'You pressed <b>Upload purchases</b>, but every row in this file is a redemption.',
          '<div class="panel" style="border-left:3px solid var(--warn)"><div style="padding:14px 18px;' +
          'font-size:13.5px;color:var(--ink2)">Redemptions reduce Net Sales, so loading them ' +
          'through the wrong button would be easy to miss and hard to spot later. Use ' +
          '<b>Upload redemptions</b> for this file.</div></div>',
          '<button class="btn pri" data-act="close">Close</button>');
      }
      /*
       * Redemption data is Admin-only. Caught here so the VRM gets a plain answer
       * instead of a rejected upload; the server refuses it regardless.
       */
      if (!can('canUploadRedemption')) {
        var red = res.rows.filter(function (r) {
          return normTxnTypeC(r.txnType) === 'REDEMPTION';
        }).length;
        if (red) {
          return modal('Redemption uploads are Admin-only',
            'This file contains <b>' + red + ' redemption row(s)</b>' +
            (window.__typeFromStatus ? ' and looks like the redemption report' : '') + '.',
            '<div class="panel" style="border-left:3px solid var(--p)"><div style="padding:14px 18px;' +
            'font-size:13.5px;color:var(--ink2)">The redemption report is a firm-wide export with no ' +
            'VRM column, so uploading it here would attribute redemptions belonging to other ' +
            'VRMs to you. ' +
            'Send the file to Admin instead.<br><br>Purchase files — SIP and Lumpsum — upload as ' +
            'usual, and your own redemptions still show in your Net Sales once Admin loads them.' +
            '</div></div>',
            '<button class="btn pri" data-act="close">Understood</button>');
        }
      }
      if (!res.rows.length) {
        return toast('No usable rows found' + (res.skipped ? ' (' + res.skipped + ' row(s) had no date or no amount)' : '') + '.', 'e');
      }
      window._pendingType = isCsv ? 'csv' : 'xlsx';
      importPreviewDialog(res.rows, res.skipped, file.name);
    } catch (err) { fail(err); }
  }
  isCsv ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
}

    if (!o) return toast('Enter your current password.', 'e');
    if (n !== n2) return toast('The two new passwords do not match.', 'e');
    var fn = isAdmin() ? 'changeAdminPassword' : 'changeVrmPassword';
    var un = lock(btn, 'Updating');
    api(fn, S.session.token, o, n).then(function (d) {
      closeModal(); absorb(d);
      toast('Password updated. Use the new password next time you sign in.');
    }).catch(function (e) { un(); fail(e); });
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el);
});

/* search boxes */
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-q]');
  if (!el) return;
  S.q[el.dataset.q] = el.value;
  S.confirm = null;
  var key = el.dataset.q, pos = el.selectionStart;
  render();
  var again = document.querySelector('[data-q="' + key + '"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
});

/* activity-log filter controls */
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-f]');
  if (!el) return;
  S.af[el.dataset.f] = el.value;
  render();
});

/* monthly-trend metric toggles */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-trend]');
  if (!el) return;
  var k = el.dataset.trend;
  S.trendOn[k] = !S.trendOn[k];
  render();
});

/* transaction-table filters and the VRM-wise sort */
document.addEventListener('change', function (e) {
  var tf = e.target.closest('[data-tf]');
  if (tf) { S[tf.dataset.tf] = tf.value; render(); return; }
  var so = e.target.closest('[data-sort]');
  if (so) { S.vrmSort = so.value; render(); }
});

/* analytics filter controls */
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-an]');
  if (!el) return;
  S.an[el.dataset.an] = el.value;
  render();
});

/* Enter submits the open dialog. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (!$('modal').classList.contains('on')) return;
  if (e.target.tagName === 'TEXTAREA') return;
  var go = $('mbox').querySelector('.mact .btn.pri, .mact .btn.dan');
  if (go) { e.preventDefault(); go.click(); }
});
</script>
